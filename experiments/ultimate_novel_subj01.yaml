# | Brain-Diffuser    | ❌            | ❌         | ❌          | ❌             |
# | NeuralDiffuser    | ❌            | ❌         | ❌          | ❌             |
# | This (Ultimate)   | ✅            | ✅         | ✅          | ✅             |

# ============================================================================
# EXPECTED BENEFITS
# ============================================================================

# 1. Better retrieval metrics (top-1, top-5 accuracy)
# 2. More robust to noisy fMRI data
