# NeuroBridge-OT: LOSO Protocol
# Taxonomy: loso_generalization
# LEGACY: Original 4-subject LOSO. For primary 8-fold LOSO, use neurobridge_ot_8subj_loso.yaml
# True zero-shot: target subject has NO learned parameters

experiment:
  name: "neurobridge_ot_loso"
  description: "NeuroBridge-OT leave-one-subject-out generalization protocol"
  tags: ["neurobridge_ot", "loso", "generalization", "zero_shot"]

protocol:
  taxonomy_label: "loso_generalization"
  training_subjects: ["subj01", "subj02", "subj05", "subj07"]
  evaluation_subjects: ["subj01", "subj02", "subj05", "subj07"]
  # Each fold holds out one subject; orchestrated by run_loso_neurobridge_ot.py

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  split_by_image: true
  exclude_shared1000: true
  val_ratio: 0.10
  embedding_column: "fused"
  seed: 42

model:
  type: "neurobridge_ot"
  d_model: 768
  output_dim: 768
  n_rois: 17
  n_canonical_tokens: 17
  use_fingerprint: true
  use_hyper_adapter: true
  tokenizer:
    type: "learned"
    n_rois: 17
    d_model: 768
    n_attn_heads: 4
    dropout: 0.1
    roi_dropout: 0.1
  fingerprint:
    fingerprint_dim: 128
    n_subjects: 8
    use_subject_embedding: false  # No subject embedding for zero-shot
  optimal_transport:
    alignment_mode: "ot"
    epsilon: 0.1
    n_sinkhorn_iters: 50
    cost_type: "cosine"
    use_anatomical_prior: true  # Use prior for unseen subjects
  transformer:
    n_heads: 12
    n_layers: 6
    dim_feedforward: 3072
    dropout: 0.1
    drop_path_rate: 0.15
    use_subject_embedding: false  # Critical for zero-shot
  heads:
    d_model: 768
    output_dim: 768
    use_vmf_head: true
    kappa_min: 0.001
    kappa_max: 500.0
  hyper_adapter:
    adapter_type: "film"
    hidden_dim: 512

loss:
  w_contrastive: 1.0
  w_regression: 0.5
  w_teacher: 0.0
  w_ot: 0.2  # Stronger OT for cross-subject alignment
  w_shared: 0.2  # Stronger consistency
  w_adversarial: 0.2  # Stronger invariance
  w_vmf: 0.3
  contrastive:
    temperature: 0.07
    symmetric: true
  vmf:
    kappa_reg_weight: 0.1
    target_kappa: 50.0
  adversarial:
    d_model: 768
    n_subjects: 8
    grl_lambda: 1.5

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 8
  amp: true
  mixed_precision_dtype: "bf16"
  patience: 30
  warmup_epochs: 5

evaluation:
  csls_k: 3
  eval_shared1000: true

paths:
  output_dir: "experimental_results/neurobridge_ot_loso"
