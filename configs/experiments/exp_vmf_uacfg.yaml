# EXP-VMF-UACFG: vMF + Uncertainty-Aware Classifier-Free Guidance
#
# Full DirBrain-lite experiment:
#   - vMF decoder with bounded-sigmoid kappa
#   - vMF-NCE contrastive loss (Bessel-free)
#   - Kappa calibration on validation set
#   - Per-sample dynamic guidance_scale and steps based on kappa
#
# Inference policy: ua_cfg_steps
#   guidance_scale = w_min + (kappa_norm^gamma) * (w_max - w_min)
#   num_steps      = steps_min + round(kappa_norm * (steps_max - steps_min))
#   where kappa_norm = clamp((kappa - q10) / (q90 - q10), 0, 1)

experiment:
  name: "exp_vmf_uacfg"
  description: "vMF model with uncertainty-aware CFG diffusion inference"
  tags: ["vmf", "vmf_nce", "ua_cfg", "diffusion", "novel"]
  parent: "exp7_vmf_nce"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1
    kappa_min: 0.001
    kappa_max: 500.0

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 0.07
    use_queue: true

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

# Uncertainty-aware diffusion inference
ua_cfg:
  policy: "ua_cfg_steps"
  w_min: 1.5
  w_max: 12.0
  gamma: 1.0
  steps_min: 10
  steps_max: 50
  calibration_path: null  # set at runtime or auto-discovered next to checkpoint

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  use_csls: true
  compute_hubness: true
  seed: 42

paths:
  output_dir: "experimental_results/exp_vmf_uacfg"
