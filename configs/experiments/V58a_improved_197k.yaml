# V58a: Improved 197K-D Single-Subject Expert
#
# Base: N1v28a_dual_head (70.1% CSLS R@1 on shared1000)
# Goal: Apply v9-era training improvements to the proven 197K-D architecture
#
# Key changes from N1v28a:
#   - dropout: 0.15 -> 0.25 (anti-overfit, validated by V57a overfitting at epoch 38/120)
#   - projection_head: disabled (incompatible with 197K-D MixCo; regression head provides separation)
#   - label_smoothing: 0.1 on vMF-NCE (softer contrastive targets)
#   - effective batch: 256 -> 1024 (batch_size 128 x grad_accum 8, H100 can handle MLP)
#   - r_drop: enabled weight 0.1 (vMF-specific dropout regularization)
#   - uniformity: enabled weight 0.05 (direct hubness reduction)
#   - mixco alpha: 0.15 -> 0.3 (stronger augmentation)
#   - kappa_reg: 0.01 -> 0.05 (stronger regularization)
#   - num_epochs: 300 -> 200 with patience 40
#   - warmup_epochs: 30 -> 10 (faster ramp with larger batch)
#
# Architecture is IDENTICAL to N1v28a:
#   - 4-layer residual MLP [8192, 8192, 4096, 2048]
#   - vMF decoder: mu_head (2048 -> 197376) L2-normed, regression_head (2048 -> 197376) raw
#   - Total: ~1.08B params
#
# Memory estimate (H100 80GB, batch_size=128):
#   Model: ~2.4 GB, Optimizer: ~12.9 GB, Queue: ~3.0 GB
#   Activations at bs=128: ~32 GB (8x N1v28a's ~4 GB at bs=16)
#   Total: ~50 GB -- tight but feasible; reduce to batch_size=64 if OOM
#
# Run:
#   python scripts/training/train_unified.py --config configs/experiments/V58a_improved_197k.yaml

experiment:
  name: "V58a_improved_197k"
  description: "v58a: N1v28a + v9 training recipe (proj head, R-Drop, label smooth, batch 1024)"
  tags: ["vmf", "vmf_nce", "v58", "dual_head", "regression", "token_targets", "csls", "shared1000", "improved"]
  parent: "N1v28a_dual_head"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.25
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.25
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 768
    regression_head: true

  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    label_smoothing: 0.1

  regression_mse:
    enabled: true
    weight: 0.5

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.05

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  r_drop:
    enabled: true
    weight: 0.1
    start_epoch: 5

  uniformity:
    enabled: true
    weight: 0.05

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 64
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 40
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.3
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
