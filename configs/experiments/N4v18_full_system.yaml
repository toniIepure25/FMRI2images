# N4v18: Full System — V17 baseline + MSE loss + PCR anti-hubness + kappa cap
#
# Base: N4v17_full_system.yaml (40.6% R@1 val, shared1000 broken by z-score bug)
# V18 changes:
#   - loss.mse: enabled (direct regression toward CLIP target, MindEye-proven)
#   - preprocessing: center_pcr k=4 (reduces hubness via PC removal)
#   - training.early_stop_min_delta: removed (was 0.002, caused premature stopping)
#   - decoder.kappa_max: 50.0 (V17 kappa=54.5 indicated overconfidence)
#   - loss.uniformity: enabled (spherical uniformity regularization, anti-hubness during training)
#   - training.kappa_curriculum: 10->50 over 60 epochs (prevents early overconfidence)

experiment:
  name: "N4v18_full_system"
  description: "v18 flagship: V17 + MSE + PCR + uniformity + kappa curriculum"
  tags: ["roi_dcf", "vmf", "mixture", "dual_ua_cfg", "ceiling", "spcl",
         "full_system", "flagship", "v18", "multi_subject", "softplus",
         "hierarchical_clip", "cka", "csls", "shared1000", "mc_tta", "mse", "pcr",
         "uniformity", "kappa_curriculum"]
  parent: "N4v17_full_system"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    kappa_max: 50.0
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 4

loss:
  mse:
    enabled: true
    weight: 1.0

  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"
  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.3
  kappa_reg:
    enabled: true
    lambda_kappa: 0.01
  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  hierarchical_clip:
    enabled: true
    weight: 0.3

  cka:
    enabled: true
    weight: 0.5
    per_subject: true

  vmf_nce:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

  uniformity:
    enabled: true
    weight: 0.1
    t: 2.0

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999
  kappa_curriculum:
    enabled: true
    start: 10.0
    end: 50.0
    anneal_epochs: 60

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  eval_shared1000: true
  checkpoint_metric: "r@1"
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v18_full_system"
