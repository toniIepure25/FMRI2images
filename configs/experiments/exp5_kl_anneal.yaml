# EXP5: + KL Annealing + Free-Bits

# Experiment metadata
experiment:
  name: "exp5_kl_anneal"
  description: "EXP4 + KL divergence with annealing and free-bits - Tests explicit regularization"
  tags: ["gaussian", "gaussian_nce", "kl", "queue", "preprocessing"]
  parent: "exp4_gaussian_nce"

# Data configuration
data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

# Model configuration (same as EXP4)
model:
  type: "gaussian"  # Outputs mu and logvar
  encoder:
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "relu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "relu"
    dropout: 0.1
    output_logvar: true

# Preprocessing configuration (same as EXP4)
preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  whiten_eps: 1e-5
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

# Loss configuration
loss:
  # Gaussian NLL (same as EXP4)
  gaussian_nll:
    enabled: true
    weight: 1.0
    type: "gaussian_nll"
    logvar_min: -10.0
    logvar_max: 5.0
    learnable_global_scale: false
    reduction: "mean"
  
  # Gaussian-NCE (same as EXP4)
  gaussian_nce:
    enabled: true
    weight: 1.0
    type: "gaussian_nce"
    use_temperature: true
    temperature: 1.0
    use_queue: true
    symmetric: false
    clamp_logvar: true
    logvar_min: -10.0
    logvar_max: 5.0
  
  # KL divergence with annealing (KEY CHANGE from EXP4)
  kl:
    enabled: true  # ✅ Add KL regularization
    weight_start: 0.0  # Start at 0
    weight_end: 0.001  # Small weight (just regularization)
    anneal_steps: 10000  # Linear annealing over 10k steps
    anneal_type: "linear"  # Options: linear, cosine, cyclical
    free_bits: 0.5  # Per-dimension free-bits threshold
    free_bits_type: "per_dim"  # Options: per_dim, total
  
  # Disable standard InfoNCE
  infonce:
    enabled: false

# Memory queue configuration (same as EXP4)
queue:
  enabled: true
  size: 8192
  store_ids: false

# Training configuration
training:
  batch_size: 4
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  
  scheduler:
    type: "cosine"
    warmup_steps: 1000
    min_lr: 1e-6
  
  gradient_clip: 1.0
  
  early_stopping:
    enabled: true
    patience: 15
    metric: "val_loss"
    mode: "min"

# Inference configuration
inference:
  use_mean_for_retrieval: true  # Use mu for standard metrics
  mc_samples_prob_metrics: 64  # Sample for probabilistic metrics
  mc_samples_prob_2afc: 64
  seed: 42

# Evaluation configuration
evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  n_identification_pairs: 5000
  n_bootstrap_samples: 1000
  compute_rsa: true
  compute_cka: true
  compute_probabilistic: true
  n_samples_energy: 64
  n_calibration_bins: 10
  seed: 42

# Logging and checkpointing
logging:
  log_every_n_steps: 50
  checkpoint_every_n_epochs: 5
  save_top_k: 3
  monitor: "val_loss"

# Output paths
paths:
  output_dir: "experimental_results/exp5_kl_anneal"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  eval_dir: "evaluation"
