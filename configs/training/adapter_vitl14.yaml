# =============================================================================
# CLIP Adapter: ViT-B/32 (512-D) -> ViT-L/14 (768-D)
# =============================================================================
#
# Lightweight adapter mapping Phase 1 encoder outputs (512-D ViT-B/32 space)
# to Phase 2 target space (768-D ViT-L/14) for improved diffusion generation.
#
# Only needed if reusing a Phase 1 encoder with a Phase 2 diffusion pipeline.
# Phase 2 experiments (EXP0-EXP14) output 768-D directly — no adapter needed.
#
# Usage:
#   python3 scripts/training/train_clip_adapter.py \
#       --config configs/training/adapter_vitl14.yaml --subject subj01
# =============================================================================

_base_: ../base.yaml

experiment:
  name: adapter_vitl14
  description: "CLIP space adapter: ViT-B/32 (512-D) -> ViT-L/14 (768-D)"
  tags: [adapter, vitl14]

dataset:
  subject: subj01
  max_trials: 30000
  train_ratio: 0.85
  val_ratio: 0.10
  test_ratio: 0.05

source_clip:
  model_name: "ViT-B/32"
  embedding_dim: 512

target_clip:
  model_name: "ViT-L/14"
  embedding_dim: 768

adapter:
  input_dim: 512
  output_dim: 768
  hidden_dims: [1536]
  dropout: 0.0
  use_layer_norm: true
  activation: gelu
  init_method: xavier_uniform
  output_init_scale: 0.01

training:
  batch_size: 256
  num_epochs: 50
  optimizer:
    type: "adamw"
    lr: 3.0e-4
    weight_decay: 0.0
    betas: [0.9, 0.999]
  warmup_epochs: 3
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 10

loss:
  mse_weight: 0.3
  cosine_weight: 0.7

data:
  source_cache: "cache/clip_embeddings/nsd_clipcache_vitb32.parquet"
  target_cache: "cache/clip_embeddings/nsd_clipcache_vitl14.parquet"
  build_cache_if_missing: true

output:
  checkpoint_path: "checkpoints/adapter/${dataset.subject}/adapter_vitb32_to_vitl14.pt"
