# =============================================================================
# CLIP Model Configuration
# =============================================================================
#
# Single source of truth for CLIP model settings.
# Do NOT hardcode model names elsewhere — always inherit from here.
#
# Phase 2 default: ViT-L/14 (768-D) to match MindEye2 and SOTA decoders.
#
# Supported Models:
#   ViT-B/32:      512-D, fastest, used in Phase 1
#   ViT-B/16:      512-D, better spatial resolution
#   ViT-L/14:      768-D, high quality (Phase 2 default)
#   ViT-L/14@336:  768-D, highest quality
# =============================================================================

# Model Selection
# -----------------------------------------------------------------------------
model_name: "ViT-L/14"
pretrained: openai
embedding_dim: 768

# Device Configuration
# -----------------------------------------------------------------------------
device: cuda
dtype: float32

# Batch Processing
# -----------------------------------------------------------------------------
batch_size: 64
num_workers: 4

# Cache Configuration
# -----------------------------------------------------------------------------
cache_dir: cache/clip_embeddings
use_cache: true
cache_format: parquet

# Feature Extraction
# -----------------------------------------------------------------------------
extract_features:
  enabled: false
  layers: [6, 12, 18, 24]
  pooling: cls_token
