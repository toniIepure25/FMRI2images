# N4v21: Full System — vMF-enhanced + ISF anti-hubness + batch 1024
#
# Base: N4v17_full_system.yaml (40.6% raw / 46.3% CSLS R@1)
# V21 changes (vMF-centric, no encoder change):
#   1. vmf_nll auxiliary loss (w=0.1) for principled kappa calibration
#   2. isf_weight: 0.3 on KappaSPCL (train-time anti-hubness via inverted softmax)
#   3. batch 128 x grad_accum 8 = effective 1024 (4x V17)
#   4. kappa_reg disabled (replaced by vmf_nll natural calibration)

experiment:
  name: "N4v21_full_system"
  description: "v21 flagship: kappa calibration + ISF + batch 1024"
  tags: ["roi_dcf", "vmf", "mixture", "dual_ua_cfg", "ceiling", "spcl",
         "full_system", "flagship", "v21", "multi_subject", "softplus",
         "hierarchical_clip", "cka", "csls", "shared1000", "mc_tta",
         "isf", "vmf_nll"]
  parent: "N4v17_full_system"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: false

loss:
  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"
    isf_weight: 0.3

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.3

  vmf_nll:
    enabled: true
    weight: 0.1

  kappa_reg:
    enabled: false

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  hierarchical_clip:
    enabled: true
    weight: 0.3

  cka:
    enabled: true
    weight: 0.5
    per_subject: true

  vmf_nce:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 128
  gradient_accumulation_steps: 8
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 2.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  eval_shared1000: true
  checkpoint_metric: "r@1"
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v21_full_system"
