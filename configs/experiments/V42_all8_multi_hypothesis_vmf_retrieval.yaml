# V42-all8: all-8-subject rerun of the 77.4% mixture-vMF line
experiment:
  name: "V42_all8_multi_hypothesis_vmf_retrieval"
  description: "V42-all8: V35-all8-initialized 4-component mixture-vMF compact retrieval head"
  tags: ["vmf_triple", "v42", "all8subjects", "cross_subject", "mixture_vmf", "compact_retrieval"]
  parent: "V38_legacy_compact_distill"

data:
  subjects: [subj01, subj02, subj03, subj04, subj05, subj06, subj07, subj08]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  one_trial_per_image_per_epoch: true
  max_unique_images_per_epoch: 40000
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  split_file: "experimental_results/V35_all8_legacy_teacher_distill/subj01/split.json"
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected_all8.h5"
  rerank_cache_method: "pca"
  rerank_cache_path: "outputs/rerank_cache/pca_trainonly_dim2048_seed42_all8.npz"
  dual_target: true

model:
  type: "vmf_triple"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V35_all8_legacy_teacher_distill/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  require_parent_split_match: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.25
    use_residual: true
  decoder:
    retrieval_dim: 768
    retrieval_num_hypotheses: 4
    rerank_enabled: true
    rerank_dim: 2048
    regression_enabled: false
    num_tokens: 257
    token_dim_per: 768
    perceptual_enabled: false
    perceptual_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.25
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 500.0
  projection_head:
    enabled: false
  cross_subject:
    enabled: true
    canonical_subject: subj01
    pretrained_checkpoint: "experimental_results/V35_all8_legacy_teacher_distill/subj01/checkpoint_best.pt"
    freeze_epochs: 8
    backbone_lr_factor: 0.15

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
  vmf_nce_mixture:
    enabled: true
    weight: 0.5
    tau: 1.0
    use_queue: true
    learnable_temperature: true
  regression_mse:
    enabled: true
    weight: 0.25
  rerank_softclip:
    enabled: true
    weight: 1.0
    tau: 0.07
    symmetric: true
    start_epoch: 12
  shortlist_teacher_distill:
    enabled: false
  legacy_teacher_distill:
    enabled: false
  legacy_compact_distill:
    enabled: true
    weight: 0.10
    teacher_checkpoint_path: "experimental_results/N1v28a_dual_head/subj01/checkpoint_best.pt"
    teacher_tau: 0.07
    student_tau: 0.07
    topk: 12
    start_epoch: 10
    teacher_step_interval: 64
    teacher_chunk_size: 1
  tri_teacher_distill:
    enabled: false
  vmf_nll:
    enabled: false
  kappa_reg:
    enabled: true
    lambda_kappa: 0.01
  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 4
  gradient_accumulation_steps: 64
  lightweight_best_checkpoint: true
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 100
  optimizer:
    type: "sgd"
    lr: 1.0e-4
    weight_decay: 0.05
    momentum: 0.0
    nesterov: false
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 0.5
  early_stop_patience: 25
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: false
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: false

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: false
  checkpoint_metric: "tri_fused_r@1"
  proxy_val_every_epochs: 1
  proxy_val_num_images: 2048
  full_val_every_epochs: 3
  mc_tta_samples: 1
  kappa_weighted_avg: true
  two_stage:
    enabled: true
  fusion:
    enabled: true
    compact_score: "csls"
    family: "weighted"
    normalization: "none"
    shortlist_k: 100
    alpha: 0.75
    csls_k: 10
  tri_fusion:
    enabled: true
    compact_score: "csls"
    legacy_score: "csls"
    family: "normalized_weighted"
    normalization: "zscore"
    shortlist_k: 150
    alpha: 0.3
    beta: 0.0
    gamma: 0.7
    csls_k: 10

inference:
  use_mean_for_retrieval: true
