# N1v25a: Sequential MixCo → SoftCLIP scheduling on wider encoder
#
# Hypothesis: V24d tested sequential scheduling but was contaminated by hard
#             negatives (hard_negative_weight=0.3) and CSLS training. This
#             isolates the scheduling effect on the proven V23a wider encoder.
#
# Changes from N1v23a:
#   - softclip_from_start: true → false  (sequential: MixCo ep1-67, SoftCLIP ep68-200)
#   Everything else identical.
#
# Expected effect: MixCo alone builds coarse alignment first, then SoftCLIP
#                  refines. May yield +1-3pp if curriculum helps vs joint training.
# Risk: SoftCLIP starting at ep68 may not converge in remaining 133 epochs.

experiment:
  name: "N1v25a_sequential"
  description: "v25a: V23a wider MLP + sequential MixCo→SoftCLIP (no hard neg, no CSLS train)"
  tags: ["vmf", "vmf_nce", "v25", "wider_encoder", "residual", "sequential", "csls", "shared1000"]
  parent: "N1v23a_wider_encoder"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: false     # <<< KEY CHANGE: sequential schedule
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
