# NeuroBridge-OT: 8-Subject Debug — Real ROI + layer_18_proj targets
# Purpose: First valid 8-subject run with verified ROI indices and correct CLIP targets.
# Simplified: no OT, no teacher, no adversarial, no vMF, no hyper-adapter.
# Goal: val R@1 should be above random and increasing within 5-10 epochs.

experiment:
  name: "neurobridge_ot_8subj_realroi_layer18proj"
  description: "8-subj debug: real ROI + layer_18_proj, minimal losses"
  tags: ["neurobridge_ot", "8subj", "debug", "realroi"]

protocol:
  taxonomy_label: "multi_subject_seen_subject"
  training_subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  evaluation_subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  target_subject_seen_during_training: true

data:
  subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  split_by_image: true
  exclude_shared1000: true
  val_ratio: 0.10
  embedding_column: "layer_18_proj"
  seed: 42

model:
  type: "neurobridge_ot"
  d_model: 768
  output_dim: 768
  n_rois: 17
  n_canonical_tokens: 17
  use_fingerprint: false
  use_hyper_adapter: false

  tokenizer:
    type: "learned"
    n_rois: 17
    d_model: 768
    n_attn_heads: 4
    dropout: 0.1
    roi_dropout: 0.1
    max_voxels_per_roi: 2000
    allow_uniform_roi_fallback: false
    roi_names: ["V1v", "V1d", "V2v", "V2d", "V3v", "V3d", "V4", "V3A", "V3B",
                "FFA1", "FFA2", "OFA", "EBA", "PPA", "OPA", "RSC", "nsdgeneral_other"]

  optimal_transport:
    alignment_mode: "none"  # Disable OT for baseline comparison
    epsilon: 0.1
    n_sinkhorn_iters: 10
    cost_type: "cosine"
    use_anatomical_prior: false

  transformer:
    n_heads: 12
    n_layers: 4
    dim_feedforward: 2048
    dropout: 0.1
    drop_path_rate: 0.1
    n_subjects: 8
    use_subject_embedding: false
    activation: "gelu"
    gradient_checkpointing: false

  heads:
    d_model: 768
    output_dim: 768
    dropout: 0.1
    use_token_head: false
    use_vmf_head: false  # Disable until base retrieval works
    use_calibration_head: false

loss:
  w_contrastive: 1.0
  w_regression: 0.5
  w_token: 0.0
  w_teacher: 0.0
  w_ot: 0.0  # OT disabled
  w_shared: 0.0  # Shared consistency disabled
  w_adversarial: 0.0  # Adversarial disabled
  w_vmf: 0.0  # vMF disabled
  w_calibration: 0.0

  contrastive:
    temperature: 0.07
    symmetric: true

training:
  epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 4
  amp: true
  mixed_precision_dtype: "bf16"
  patience: 15
  warmup_epochs: 3

evaluation:
  csls_k: 3
  eval_shared1000: false

paths:
  output_dir: "experimental_results/neurobridge_ot_8subj_realroi_layer18proj"
