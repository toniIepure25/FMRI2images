# V60a: Multi-Subject CLS Pretraining with Learned Neural Alignment
#
# Phase 1 of V60 pipeline: 4-subject pretraining with 768-D CLS targets.
# The adapters learn cross-subject alignment on the CLIP CLS representation,
# which is fast and memory-efficient (~862M params, batch_size=64).
#
# Phase 2 (V60b): subj01 finetuning with 197K-D token targets from N1v28a.
#
# This mirrors MindEye2's two-phase approach:
#   Phase 1: cross-subject pretraining (CLS)  -- this config
#   Phase 2: single-subject finetuning (tokens) -- V60b
#
# Architecture:
#   fMRI (subject-specific voxels)
#     -> Per-subject Linear adapter: nn.Linear(subj_vox, 15724, bias=False)
#        (canonical subj01: identity, no adapter)
#     -> Shared MLP encoder: [8192, 8192, 4096, 2048] + residual + GELU
#     -> vMF decoder: 768-D CLS direction + kappa (concentration)
#
# Training protocol:
#   Phase A (epochs 1-30): BACKBONE FROZEN. Only adapters + kappa train.
#   Phase B (epochs 31-200): Backbone UNFROZEN at 0.1x base LR.
#
# Memory estimate (H100 80GB, 100GiB cgroup):
#   Model (bf16): ~862M params → ~1.7 GB
#   Optimizer:    ~862M × 8B → ~6.9 GB
#   fMRI data:    4 subjects × ~1.5 GB = ~6 GB
#   CLIP (768-D): ~20 MB (CLS only, no token cache!)
#   Queue:        4096 × 768 × 4B = ~12 MB
#   Total:        ~15 GB GPU + ~8 GB CPU — well within limits
#
# Run:
#   python scripts/training/train_unified.py --config configs/experiments/V60a_cross_subject_197k.yaml

experiment:
  name: "V60a_cross_subject_197k"
  description: "v60a: 4-subject CLS pretraining with learned neural alignment"
  tags: ["vmf", "vmf_nce", "v60", "cross_subject", "multi_subject", "adapter",
         "csls", "shared1000", "phase1"]
  parent: "N1v28a_dual_head"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_encoder_path: "experimental_results/N1v28a_dual_head/subj01/checkpoint_best.pt"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"

  projection_head:
    enabled: false

  cross_subject:
    enabled: true
    canonical_subject: "subj01"
    freeze_epochs: 30
    backbone_lr_factor: 0.1

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: false

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  lightweight_best_checkpoint: true
  early_stop_patience: 50
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: false

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
