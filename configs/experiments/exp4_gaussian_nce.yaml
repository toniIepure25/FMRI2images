# EXP4: + Gaussian-NCE (Distribution-Aware Contrastive)
#
# Replaces standard InfoNCE with Gaussian-NCE — the contrastive loss
# now operates on the full predicted distribution (mu, sigma) rather
# than a point estimate, enabling uncertainty-aware negative mining.
#
# Key change vs EXP3: loss.gaussian_nce replaces loss.infonce
#
# Hypothesis: H4: Gaussian-NCE improves calibration and retrieval by
#             incorporating predictive uncertainty into the contrastive
#             objective.

experiment:
  name: "exp4_gaussian_nce"
  description: "Gaussian model with NLL + Gaussian-NCE"
  tags: ["gaussian", "gaussian_nce", "queue", "preprocessing"]
  parent: "exp3_gaussian_nll"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "gaussian"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1
    output_logvar: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  whiten_eps: 1.0e-5
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  gaussian_nll:
    enabled: true
    weight: 1.0
    logvar_min: -10.0
    logvar_max: 5.0
    reduction: "mean"
  gaussian_nce:
    enabled: true
    weight: 1.0
    temperature: 1.0
    use_queue: true
    symmetric: false
    clamp_logvar: true
    logvar_min: -10.0
    logvar_max: 5.0
  infonce:
    enabled: false
  mse:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/exp4_gaussian_nce"
