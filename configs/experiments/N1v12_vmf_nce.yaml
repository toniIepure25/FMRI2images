# N1v12: vMF-NCE — Two-Stage Training + Kappa Cap + Scaled Encoder
#
# V12 strategy: address four root causes of the V10/V11 ~51% R@1 ceiling.
#
# Root cause fixes:
#   1. average_repetitions: false (V11 reduced data 3x, killing contrastive learning)
#   2. kappa_max: 50 (softplus path now respects this; prevents kappa explosion >100)
#   3. Two-stage training: contrastive (epochs 1-120) then vMF-NLL fine-tuning (120+)
#   4. Simplified losses (no V11 additions: CSLS training, ISF, alignment, uniformity)
#
# Additional improvements:
#   - Scaled encoder: [8192, 8192, 4096, 4096, 2048] (~600M params, up from 380M)
#   - Effective batch 512 (grad_accum 8, up from 4)
#   - LR scaled by sqrt(2) for doubled effective batch

experiment:
  name: "N1v12_vmf_nce"
  description: "v12 vMF-NCE: two-stage training + kappa cap + scaled MLP + eff. batch 512"
  tags: ["vmf", "vmf_nce", "queue", "novel", "v12", "softplus", "fused_targets",
         "csls", "mc_tta", "hard_neg", "model_soup", "two_stage", "kappa_cap",
         "scaled_mlp"]
  parent: "N1v10_vmf_nce"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 4096, 2048]
    activation: "gelu"
    dropout: 0.2
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
    kappa_max: 50.0

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    hard_negative_weight: 0.5
    hard_neg_k: 16

  vmf_nll:
    enabled: true
    weight: 0.0
    dim: 768

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 65536

training:
  batch_size: 64
  gradient_accumulation_steps: 8
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  save_frequency: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999
  stage2:
    enabled: true
    start_epoch: 120
    lr_factor: 0.1
    vmf_nll_weight: 2.0
    softclip_weight: 0.3
    vmf_nce_weight: 0.0
    mixco_enabled: false
    patience: 20

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  model_soup: true
  soup_top_k: 5
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/N1v12_vmf_nce"
