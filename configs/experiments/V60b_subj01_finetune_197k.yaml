# V60b: Subject-01 Finetuning from V60a Multi-Subject Checkpoint
#
# Phase 2 of the MindEye2-style two-phase protocol:
#   Phase 1 (V60a): Pre-train on 8 subjects (~70K unique images, 197K-D)
#   Phase 2 (this): Fine-tune on subj01 only (~9K unique images, 197K-D)
#
# Key rationale: V60a learns a general fMRI->CLIP mapping from 8x data volume.
# But the adapters introduce noise since cross-subject alignment is imperfect.
# Phase 2 strips away adapters and fine-tunes the entire model exclusively on
# subj01's native voxels, specializing the general representation.
#
# Architecture:
#   - EXACT same as N1v28a (no adapters, no cross-subject)
#   - Encoder loaded from V60a checkpoint (subj01 adapter = identity, so
#     the encoder already produces native subj01 representations)
#   - Lower LR (1e-5 vs 3e-5) to preserve learned features
#
# Changes from V60a:
#   - Single subject (subj01 only)
#   - cross_subject: disabled (adapters stripped)
#   - pretrained_checkpoint loads V60a best checkpoint
#   - LR: 1e-5 (3x lower than V60a, fine-tuning regime)
#   - warmup_epochs: 5 (minimal, model already trained)
#   - patience: 30 (tighter, expect convergence sooner)
#   - num_epochs: 100 (sufficient for fine-tuning)
#
# Expected outcome:
#   - N1v28a (single-subject only): 70.1% CSLS R@1
#   - V60b (pretrained on 8 subjects): target 80-90%+ CSLS R@1
#
# Run:
#   python scripts/training/train_unified.py --config configs/experiments/V60b_subj01_finetune_197k.yaml

experiment:
  name: "V60b_subj01_finetune_197k"
  description: "v60b: Subj01 fine-tuning from V60a multi-subject 197K-D checkpoint"
  tags: ["vmf", "vmf_nce", "v60", "finetune", "single_subject", "dual_head",
         "regression", "token_targets", "197k", "csls", "shared1000", "phase2"]
  parent: "V60a_cross_subject_197k"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V60a_cross_subject_197k/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 768
    regression_head: true

  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 16
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-7
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 5
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
