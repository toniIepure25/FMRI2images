# V62a SHARED1000 target-only 1k gallery manifold analysis.
#
# This protocol is intended to match the saved shared1000_metrics.json
# benchmark where gallery_size=1000. The full-gallery 10k protocol should use
# analysis.gallery_mode: full instead.

artifacts:
  z_pred_path: /home/jovyan/work/FMRI2images/experimental_results/V62a_cls_retrieval_768d/subj01/metrics/shared1000_predictions.npy
  z_target_path: /home/jovyan/work/FMRI2images/experimental_results/V62a_cls_retrieval_768d/subj01/metrics/shared1000_ground_truth.npy
  target_ids_path: /home/jovyan/work/FMRI2images/experimental_results/V62a_cls_retrieval_768d/subj01/metrics/shared1000_nsd_ids.npy
  kappa_path: null
  gallery_embeddings_path: /home/jovyan/work/FMRI2images/outputs/clip_cache/clip.parquet
  gallery_id_column: "nsdId"
  experiment_id: V62a_cls_retrieval_768d_shared1000_1k_gallery
  subject: subj01

output:
  output_dir: null
  save_formats: ["png"]

analysis:
  gallery_mode: target_ids
  allow_diagonal_fallback: false
  normalize_embeddings: true
  seed: 42
  bootstrap_n: 500
  top_k: [1, 5, 10, 20, 50, 100]
  csls_k: 10
  rsa_max_samples: 1000
  neighborhood_ks: [5, 10, 20, 50, 100]
  manifold_density_k: 20
  calibration_n_bins: 10
  coverage_levels: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]

modules:
  retrieval: true
  hubness: true
  rsa: true
  neighborhood: true
  repeat_stability: false
  uncertainty: false
  manifold_density: true
  reliability: true
  semantic_probes: false
  semantic_axes: false
  vector_field: true
  counterfactuals: false
  interpolation: false
  roi_axes: false
  nmas: true
