# N4v4: Full System — v4 optimized flagship
#
# Changes from N4v3:
#   - preprocessing.enabled: false (stop center_pcr destroying CLIP signal)
#   - data.normalize_fmri: true (per-voxel z-scoring)
#   - data.average_repetitions: false (train on individual trials, 3x more samples)
#   - training.mixco: enabled (MixCo augmentation)
#   - lr: 2e-4 (MindEye2-aligned), warmup: 15 epochs
#   - kappa_max: 100 (wider dynamic range)
#   - grad_accum: 2 (effective batch 128)
#   - patience: 60, sharper tau: 0.05
#   - lighter kappa_reg, reduced lambda_aux

experiment:
  name: "N4v4_full_system"
  description: "v4 flagship: z-scored fMRI, no PCR, individual trials, MixCo, optimized HP"
  tags: ["roi_dcf", "vmf", "mixture", "dual_ua_cfg", "ceiling", "spcl", "full_system", "flagship", "v4"]
  parent: "N3v4_roi_dcf"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.15
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_min: 1.0
    kappa_max: 100.0
    dropout: 0.15
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: false

loss:
  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"
  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.3
  kappa_reg:
    enabled: true
    lambda_kappa: 0.02
  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true
  vmf_nce:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 2
  mixed_precision: true
  num_epochs: 300
  optimizer:
    type: "adamw"
    lr: 2.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 60
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 1.0

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v4_full_system"
