# Tiny smoke config (fast, minimal) for tests/dev
_base_: ../../../base.yaml

experiment:
  name: smoke_tiny
  description: "Tiny debug run for CI (small batches, few steps)"
  tags: [smoke, tiny, fast]

decoder:
  type: probabilistic
  uncertainty: diag
  predict_logvar: true
  logvar_min: -8.0
  logvar_max: 2.0
  variance_floor: 1.0e-6

dataset:
  max_trials: 64          # keep tiny/fast but ensure val split has a few samples
  train_ratio: 0.7
  val_ratio: 0.2          # guarantees >=4 val samples with 64-limit
  test_ratio: 0.1

training:
  seed: 123
  mixed_precision: false
  gradient_clip: 1.0
  save_frequency: 1

preprocessing:
  enable_reliability_filter: true
  reliability_threshold: 0.0
  enable_pca: true
  pca_k: 64

loss:
  cosine_weight: 0.0
  mse_weight: 0.0
  infonce_weight: 0.0
  nll_weight: 1.0
  cosine_aux_weight: 0.1
  variance_penalty_weight: 0.01
  nll_reduction: mean
  logvar_min: -8.0
  logvar_max: 2.0
  variance_floor: 1.0e-6

inference:
  sampling_policy: fixed_k
  K_base: 1
  enforce_budget: true
  selection_rule: cosine
