# N1v28b: Dual-Head MindEye-Style + ViT-bigG/14 (Full MindEye Recipe)
#
# Hypothesis: Combining the dual-head architecture (V28a) with bigG tokens
#             (V27a) gives the full MindEye-style setup.  If V28a confirms
#             the dual-head works on ViT-L/14, V28b scales it to bigG.
#
# Architecture:
#   - Same 4-layer residual MLP encoder [8192, 8192, 4096, 2048]
#   - vMF decoder with DUAL heads (bigG dimensions):
#     * mu_head: (2048 -> 328960) L2-normalised -> vMF-NCE + SoftCLIP + MixCo
#     * regression_head: (2048 -> 328960) un-normalised -> MSE in R^d
#     * kappa_head: (2048 -> 1) softplus concentration
#   - Total params: ~825M (mu) + ~674M (reg) ≈ ~1.5B
#
# Memory estimate (H100 80GB, ~45.5 GiB usable):
#   Model weights:  ~3.0 GB  (~1.5B params × bf16)
#   Optimizer:     ~18.0 GB  (AdamW: 3 × 1.5B × 4B)
#   Queue:          ~1.3 GB  (1024 × 328960 × 4B)
#   Activations:    ~3.0 GB  (batch 12, 4 layers + 2 heads)
#   Total:         ~25.3 GB  ← tight but should fit
#
# IMPORTANT: Only run after V28a confirms dual-head works on ViT-L/14.
#            If OOM, reduce batch_size to 8 and increase accum to 32.
#
# Run:
#   make ablation ONLY=N1v28b SUBJECTS=subj01 GPU=0

experiment:
  name: "N1v28b_dual_head_bigg"
  description: "v28b: Dual-head + ViT-bigG/14 tokens (full MindEye recipe)"
  tags: ["vmf", "vmf_nce", "v28", "dual_head", "bigg", "regression", "token_targets", "csls", "shared1000"]
  parent: "N1v28a_dual_head"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  # bigG projected token cache
  token_cache_path: "outputs/clip_cache/tokens_ViT-bigG-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null   # auto-filled: 257 * 1280 = 328960
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 1280
    regression_head: true

  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 1024      # conservative for bigG + dual-head memory

training:
  batch_size: 12                    # reduced for ~1.5B model
  gradient_accumulation_steps: 22   # effective batch = 12 × 22 ≈ 264
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 250
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 25
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 40
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
