# V55c: Fusion Topology Distillation on V55b Dual-Head Student
#
# Hypothesis: The V55b student can be further improved by distilling the
# frozen best-system fusion ranking topology. Unlike V53 which used
# vmf_triple, this uses the simplified vmf dual-head architecture and
# initializes from the multi-subject pre-trained + fine-tuned V55b checkpoint.
#
# The dual-head architecture means the fusion distillation signal goes
# directly to the retrieval head without gradient competition from a
# separate rerank head, which should improve transfer quality.
#
# Kill criteria:
#   - CSLS R@1 on SHARED1000 < V55b's CSLS R@1 -> distillation hurting
#   - tri_fused R@1 on SHARED1000 < 79% -> not beating V35 frozen fusion
#
# Run:
#   make train CONFIG=configs/experiments/V55c_fusion_distill.yaml SUBJECT=subj01

experiment:
  name: "V55c_fusion_distill"
  description: "V55c: fusion topology distillation into V55b dual-head student + uniformity"
  tags:
    - vmf
    - v55c
    - phase3_distill
    - dual_head
    - regression
    - token_targets
    - fusion_distill
    - uniformity
    - pretrained_model_required
    - roadmap_ppr
  parent: "V55b_subj01_finetune"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V55b_subj01_finetune/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.20
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.20
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 500.0
    num_tokens: 257
    token_dim: 768
    regression_head: true
  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.3

  softclip:
    enabled: true
    weight: 0.5
    tau: 0.05
    use_queue: true
    symmetric: true

  fusion_ranking_distill:
    enabled: true
    weight: 0.25
    recipe_summary_path: "docs/thesis/results/final_outputs/best_system/final_metrics_summary.json"
    strict_recipe: true
    fallback_recipe:
      compact_score: "csls"
      legacy_score: "csls"
      family: "normalized_weighted"
      normalization: "zscore"
      shortlist_k: 150
      alpha: 0.3
      beta: 0.0
      gamma: 0.7
      expected_shared1000_r@1: 0.772
      saved_shared1000_r@1: 0.772
    compact_topk: 16
    teacher_topk: 32
    teacher_tau: 0.07
    student_tau: 0.07
    gate_max_rank: 20
    topk_overlap_k: 10
    start_epoch: 5
    csls_k: 10
    symmetric: false

  uniformity:
    enabled: true
    weight: 0.05
    t: 2.0

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  legacy_teacher_distill:
    enabled: false
  shortlist_teacher_distill:
    enabled: false
  tri_teacher_distill:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 16
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 60
  optimizer:
    type: "adamw"
    lr: 5.0e-6
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 3
  min_lr: 1.0e-7
  gradient_clip: 1.0
  early_stop_patience: 15
  early_stop_min_delta: 0.001
  train_r1_interval: 10
  fmri_noise_std: 0.05
  voxel_dropout: 0.05
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.3
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  best_checkpoints: [csls_r@1]
  mc_tta_samples: 8
  kappa_weighted_avg: true
  ppr:
    enabled: true
  two_stage:
    enabled: false
  fusion:
    enabled: false
  tri_fusion:
    enabled: true
    compact_score: "csls"
    legacy_score: "csls"
    family: "normalized_weighted"
    normalization: "zscore"
    shortlist_k: 150
    alpha: 0.3
    beta: 0.0
    gamma: 0.7
    csls_k: 10

inference:
  use_mean_for_retrieval: true
