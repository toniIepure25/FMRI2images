# EXP1: + Embedding Preprocessing (center_pcr)
#
# Adds PCR (Principal Component Regression) embedding preprocessing
# to the baseline. This geometrically corrects the anisotropic CLIP
# embedding space, reducing hubness.
#
# Key change vs EXP0: preprocessing.enabled = true, mode = center_pcr
#
# Hypothesis: H1: PCR reduces hubness and improves retrieval metrics
#             (R@1, MRR) without degrading embedding quality (cosine).

experiment:
  name: "exp1_preproc"
  description: "Baseline + embedding preprocessing (center_pcr k=8)"
  tags: ["deterministic", "preprocessing"]
  parent: "exp0_baseline"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "deterministic"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  whiten_eps: 1.0e-5
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  mse:
    enabled: true
    weight: 1.0
  infonce:
    enabled: true
    weight: 1.0
    temperature: 0.07
    learnable_temperature: true
    symmetric: true
    use_queue: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: false

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 0
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: false
  seed: 42

paths:
  output_dir: "experimental_results/exp1_preproc"
