# N3v19: ROI-DCF — V17 foundation + margin + DirectAlign + loss simplification + ROI-Token Dropout
#
# Base: N3v17_roi_dcf.yaml (47.0% CSLS R@1)
# V19 changes from V17:
#   - loss.vmf_nce.margin_base: 0.15 (reduced from V17's 0.2)
#   - loss.direct_alignment: enabled (1 - cos_sim, properly scaled regression)
#   - loss.vmf_nce_multitask.lambda_aux: 0.0 (disable mt_aux — it forces V1/V2 to
#     predict global semantics, generating contradictory gradients. Keep mt_fused only)
#   - loss.hierarchical_clip: disabled (contributed only 1% of total loss)
#   - loss.cka: disabled (contributed only 1% of total loss)
#   - model.encoder.roi_token_dropout: 0.1 (regularize ROI Transformer)
#   - training.early_stop_min_delta: removed
#   - training.kappa_curriculum: enabled (from V18, gradual kappa_max increase)

experiment:
  name: "N3v19_roi_dcf"
  description: "v19 ROI-DCF: V17 base + margin + DirectAlign + simplified losses + ROI-Token Dropout"
  tags: ["roi_dcf", "vmf", "vmf_nce", "multi_task", "interpretable", "novel", "v19",
         "multi_subject", "softplus", "csls", "shared1000", "mc_tta",
         "margin", "direct_align", "roi_token_dropout", "kappa_curriculum"]
  parent: "N3v17_roi_dcf"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
    roi_token_dropout: 0.1
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    kappa_max: 50.0
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_arctanh: true
    margin_base: 0.15
    margin_kappa_ref: 50.0

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.0

  direct_alignment:
    enabled: true
    weight: 2.0

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  hierarchical_clip:
    enabled: false

  cka:
    enabled: false

  vmf_nll:
    enabled: false
  mse:
    enabled: false
  uniformity:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  kappa_curriculum:
    enabled: true
    start: 10.0
    end: 50.0
    anneal_epochs: 60
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42
  ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma: 1.0
    steps_min: 10
    steps_max: 50
    delta_beta: 0.5

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  eval_shared1000: true
  checkpoint_metric: "r@1"
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  compute_per_roi_analysis: true
  seed: 42

paths:
  output_dir: "experimental_results/N3v19_roi_dcf"
