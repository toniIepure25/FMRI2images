# =============================================================================
# JupyterHub Quick Start Example Configuration
# =============================================================================
# A minimal configuration for testing the pipeline on JupyterHub/HPC.
# This is a dummy configuration that demonstrates the structure.
# Replace with your actual model and data parameters.
#
# Usage:
#   bash scripts/run_experiment_simple.sh configs/experiments/jupyterhub_quickstart.yaml
# =============================================================================

# Experiment metadata
experiment_name: jupyterhub_quickstart
description: Quick start example for JupyterHub environment

# Random seed for reproducibility
seed: 42

# Training parameters
num_epochs: 5
batch_size: 32
learning_rate: 0.0001

# Device configuration
device: cuda  # Use 'cpu' if GPU not available

# Data parameters (customize for your dataset)
data:
  train_split: train
  val_split: val
  num_workers: 4

# Model parameters (example structure)
model:
  type: mlp
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1

# Logging
log_level: INFO
log_interval: 10  # Log every N steps

# Checkpointing
checkpoint_interval: 1  # Save checkpoint every N epochs
save_best_only: false

# Output directory (can be overridden by environment variable)
# runs_dir: /bigdata/userhome/students/<USER>/runs

# Optional: Weights & Biases integration
# wandb:
#   enabled: false
#   project: fmri2img
#   entity: your_entity
