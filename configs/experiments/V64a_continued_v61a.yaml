# V64a: Continued Training from V61a's Best Checkpoint
#
# V61a achieved 79.1% CSLS R@1 (k=10) on shared1000, 80.8% with MC-TTA.
# V63a attempted stronger training but HURT performance (75.4%) because:
#   - encoder_lr too high (1e-5 vs V61a's 3e-6) -> damaged encoder features
#   - decoder architecture changed -> couldn't load pretrained weights
#   - augmentation too aggressive
#
# V64a: conservative continued training from V61a:
#   - Start from V61a's best checkpoint (not V60a!)
#   - encoder_lr: 1e-6 (3x lower than V61a, near-frozen)
#   - decoder_lr: 5e-5 (1.7x higher than V61a, push decoder harder)
#   - regression_mse weight: 1.0 (2x V61a, stronger token alignment)
#   - label_smoothing: 0.05 (new, NCE regularization)
#   - cosine schedule warmup: 10 (shorter, already pretrained decoder)
#   - epochs: 250, patience: 60
#   - Same architecture (weights load cleanly from V61a)
#
# Target: 82-84% CSLS R@1 single model -> 87-90% with MC-TTA+fusion

experiment:
  name: "V64a_continued_v61a"
  description: "v64a: Continued training from V61a best, near-frozen encoder, aggressive decoder"
  tags: ["vmf", "vmf_nce", "v64", "finetune", "single_subject", "token_targets",
         "197k", "continued_training", "frozen_encoder"]
  parent: "V61a_finetune_difflr"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V61a_finetune_difflr/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.30
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 768
    regression_head: true

  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    label_smoothing: 0.05

  regression_mse:
    enabled: true
    weight: 1.0

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 32
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 250
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    encoder_lr: 1.0e-6
    decoder_lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-8
  gradient_clip: 1.0
  early_stop_patience: 60
  early_stop_min_delta: 0.001
  train_r1_interval: 5
  fmri_noise_std: 0.10
  voxel_dropout: 0.10
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 16
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
