# V60a: Multi-Subject 197K-D Pretraining with Learned Neural Alignment
#
# THE KEY EXPERIMENT: N1v28a's proven 197K-D dual-head architecture trained
# on all 8 NSD subjects via end-to-end learned linear adapters.
#
# Previous multi-subject attempts (V55a, V57a) all used 768-D CLS targets
# and failed (21-45% CSLS R@1). N1v28a's 197K-D single-subject baseline is
# 70.1%. This config combines 8-subject data scaling (~70K unique images)
# with 197K-D token targets -- the combination never attempted before.
#
# Architecture:
#   fMRI (subject-specific voxels)
#     -> Per-subject Linear adapter: nn.Linear(subj_vox, 15724, bias=False)
#        (canonical subj01: slice identity, no adapter)
#     -> Shared MLP encoder: [8192, 8192, 4096, 2048] + residual + GELU
#     -> vMF decoder:
#        * mu_head: (2048 -> 197376) L2-norm -> vMF-NCE + SoftCLIP + MixCo
#        * regression_head: (2048 -> 197376) raw -> MSE
#        * kappa_head: (2048 -> 1) softplus -> concentration/uncertainty
#
# Training protocol (MindEye2-style two-phase):
#   Phase A (epochs 1-30): BACKBONE FROZEN. Only adapters + kappa_head train.
#     N1v28a's proven encoder provides stable gradient for alignment learning.
#   Phase B (epochs 31-200): Backbone UNFROZEN at 0.1x base LR.
#     Joint optimization: adapters refine + backbone learns from 8x data.
#
# Memory estimate (H100 80GB):
#   Model (bf16):    ~2.4 GB encoder + ~0.8 GB regr head
#   Optimizer:       ~12.9 GB (AdamW fp32)
#   7 adapters:      ~3.1 GB (7 x 15K x 15K x 2B)
#   Queue:           ~3.2 GB (4096 x 197376 x 4B)
#   Activations:     ~4.0 GB (bs=16)
#   Total:           ~26.4 GB -- fits safely
#
# Uses N1v28a's PROVEN recipe (not v9): V58a showed v9 regularization hurts
# 197K-D models (-9pp vs N1v28a). Keep: dropout 0.15, no label smoothing,
# no R-Drop, no uniformity, kappa_reg 0.01, MixCo alpha 0.15.
#
# Run:
#   python scripts/training/train_unified.py --config configs/experiments/V60a_cross_subject_197k.yaml

experiment:
  name: "V60a_cross_subject_197k"
  description: "v60a: 8-subject 197K-D pretraining with learned neural alignment"
  tags: ["vmf", "vmf_nce", "v60", "cross_subject", "multi_subject", "adapter",
         "dual_head", "regression", "token_targets", "197k", "csls", "shared1000"]
  parent: "N1v28a_dual_head"

data:
  subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_encoder_path: "experimental_results/N1v28a_dual_head/subj01/checkpoint_best.pt"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 768
    regression_head: true

  projection_head:
    enabled: false

  cross_subject:
    enabled: true
    canonical_subject: "subj01"
    freeze_epochs: 30
    backbone_lr_factor: 0.1

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 16
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 50
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
