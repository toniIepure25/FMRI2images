# =============================================================================
# Fast Inference Configuration
# =============================================================================
#
# Speed-optimized for rapid prototyping and batch evaluation.
# 25 diffusion steps, 512px output, FP16.
#
# Usage:
#   python3 scripts/reconstruction/decode_diffusion.py \
#       --config configs/inference/fast_inference.yaml \
#       --checkpoint path/to/best_model.pt
# =============================================================================

_base_: production.yaml

experiment:
  name: fast_inference
  description: "Speed-optimized inference for batch evaluation"
  tags: [fast, batch]

model:
  dtype: float16

diffusion:
  model_id: "sd2-community/stable-diffusion-2-1"
  variant: fp16
  num_inference_steps: 25
  guidance_scale: 7.0
  scheduler: euler
  output_size: 512
  output_format: jpg

  enable_attention_slicing: true
  enable_vae_slicing: true
  use_tf32: true

batch_processing:
  batch_size: 4
  max_batch_size: 8
  auto_batch_size: true

output:
  output_dir: "outputs/generations/fast/${dataset.subject}"
  save_embeddings: false
  save_metadata: false

evaluation:
  compute_metrics: false
