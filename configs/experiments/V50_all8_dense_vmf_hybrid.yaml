# V50: All-8-Subject Dense-vMF Hybrid
#
# Purpose:
#   - replace the underpowered compact-first mixture-vMF line with a stronger
#     dense retrieval expert trained across all available subjects
#   - keep a lightweight auxiliary vMF head only for confidence / routing /
#     resolver features, not as the main scorer
#   - keep the rerank branch as residual evidence and the frozen N1v28a legacy
#     expert as complementary inference-time evidence
#
# Canonical run:
#   make ablation ONLY=V50 SUBJECTS=subj01 GPU=0 SAVE_CKPT=best

experiment:
  name: "V50_all8_dense_vmf_hybrid"
  description: "V50: all-8-subject dense-first retrieval model with auxiliary vMF confidence head and legacy-aware fusion checkpointing"
  tags:
    - v50
    - dense_vmf_hybrid
    - cross_subject
    - all8subjects
    - dense_first
    - vmf_auxiliary
    - legacy_fusion
  parent: "V35_legacy_teacher_distill"

data:
  subjects: [subj01, subj02, subj03, subj04, subj05, subj06, subj07, subj08]
  subject: subj01
  roi: nsdgeneral
  train_split: 0.9
  val_split: 0.1
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: per_session
  embedding_column: fused
  seed: 42
  token_cache_path: outputs/clip_cache/tokens_ViT-L-14_projected.h5
  rerank_cache_method: pca
  rerank_cache_path: outputs/rerank_cache/pca_trainonly_dim2048_seed42.npz
  dual_target: true

model:
  type: "dense_vmf_hybrid"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V35_legacy_teacher_distill/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.25
    use_residual: true
  decoder:
    retrieval_dim: 768
    rerank_enabled: true
    rerank_dim: 2048
    regression_enabled: false
    num_tokens: 257
    token_dim_per: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.20
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 200.0
  projection_head:
    enabled: false
  cross_subject:
    enabled: true
    canonical_subject: subj01
    pretrained_checkpoint: "experimental_results/V35_legacy_teacher_distill/subj01/checkpoint_best.pt"
    freeze_epochs: 8
    backbone_lr_factor: 0.15

preprocessing:
  enabled: false

loss:
  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  vmf_nce:
    enabled: true
    weight: 0.15
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  rerank_softclip:
    enabled: true
    weight: 0.35
    tau: 0.07
    symmetric: true
    start_epoch: 18

  regression_mse:
    enabled: false

  legacy_compact_distill:
    enabled: true
    weight: 0.10
    teacher_checkpoint_path: "experimental_results/N1v28a_dual_head/subj01/checkpoint_best.pt"
    teacher_tau: 0.07
    student_tau: 0.07
    topk: 12
    start_epoch: 5
    teacher_chunk_size: 1

  component_legacy_compact_distill:
    enabled: false

  shortlist_teacher_distill:
    enabled: false

  legacy_teacher_distill:
    enabled: false

  tri_teacher_distill:
    enabled: false

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 4
  gradient_accumulation_steps: 64
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 120
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 8
  min_lr: 1.0e-6
  gradient_clip: 0.5
  early_stop_patience: 35
  early_stop_min_delta: 0.0005
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: false
    alpha: 0.15
    temperature: 0.07
    weight: 0.4
  ema:
    enabled: false
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "tri_fused_r@1"
  best_checkpoints: [csls_r@1, vmf_csls_r@1, tri_fused_r@1]
  mc_tta_samples: 1
  kappa_weighted_avg: false
  two_stage:
    enabled: true
  fusion:
    enabled: true
    compact_score: "csls"
    family: "weighted"
    normalization: "none"
    shortlist_k: 100
    alpha: 0.75
    csls_k: 10
  tri_fusion:
    enabled: true
    compact_score: "csls"
    legacy_score: "csls"
    family: "normalized_weighted"
    normalization: "zscore"
    shortlist_k: 150
    alpha: 0.3
    beta: 0.0
    gamma: 0.7
    csls_k: 10

inference:
  use_mean_for_retrieval: true
