# N4v15: Full System — Fix the Fundamentals
#
# V15 strategy: fix three critical bottlenecks:
#   1. Re-enable CLIP embedding PCR (center_pcr k=4) — eliminates hubness at source
#   2. Increase batch_size 64->256 — 4x more in-batch contrastive negatives
#   3. Z-scoring bug fixed in train_unified.py — N4 now gets per-session normalization
#   4. Drop V14 anti-hubness overhead (CSLS training, ISF, direct alignment)
#
# V14 results (subj01): R@1 ~44-45%, CSLS R@1 ~55-58%  (gap: ~10-13 pp)

experiment:
  name: "N4v15_full_system"
  description: "v15 flagship: PCR + large batch + z-scoring fix + SPCL + DUA-CFG"
  tags: ["roi_dcf", "vmf", "mixture", "dual_ua_cfg", "spcl",
         "full_system", "flagship", "v15", "multi_subject", "softplus",
         "csls", "mc_tta", "hard_neg", "model_soup", "two_stage",
         "kappa_cap", "wider_ffn", "mse_regression", "hierarchical_clip",
         "pcr", "large_batch", "zscore_fix"]
  parent: "N4v14_full_system"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 1024
    nhead: 16
    num_layers: 6
    dim_feedforward: 8192
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    kappa_max: 50.0
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 4

loss:
  mse:
    enabled: true
    weight: 1.0

  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"
    hard_negative_weight: 0.5
    hard_neg_k: 16
    use_csls_training: false
    isf_weight: 0.0

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.05

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  direct_alignment:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  vmf_nll:
    enabled: false
  vmf_nce:
    enabled: false
  hierarchical_clip:
    enabled: true
    weight: 0.5
  cka:
    enabled: false
  r_drop:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 256
  gradient_accumulation_steps: 2
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 1.4e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  checkpoint_metric: "r@1"
  save_frequency: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999
  stage2:
    enabled: true
    start_epoch: 80
    lr_factor: 0.1
    mse_weight: 2.0
    vmf_nce_spcl_weight: 0.3
    softclip_weight: 0.5
    hierarchical_clip_weight: 0.2
    mixco_enabled: false
    patience: 20

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  model_soup: true
  soup_top_k: 5
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v15_full_system"
