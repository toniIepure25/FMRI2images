# V55b: Subject-01 Fine-Tuning Phase 2 (from V55a multi-subject dual-head)
#
# Hypothesis: Fine-tuning the V55a multi-subject dual-head encoder on subj01
# with legacy teacher distillation + fusion ranking distillation will yield
# a single model that captures both compact and legacy expert signals.
#
# Architecture: Same vmf dual-head as V55a, initialized from V55a checkpoint.
# Adds legacy teacher distillation and fusion ranking distillation to
# internalize the frozen fusion topology into the student.
#
# Key differences from V54b:
#   - model.type: "vmf" (dual-head) not "vmf_triple"
#   - no rerank head -> all gradient goes to retrieval + regression
#   - uniformity regularization retained from V55a
#   - fusion ranking distillation from frozen best-system recipe
#
# Kill criteria:
#   - CSLS R@1 on SHARED1000 < 72% after 30 epochs -> no gain from Phase 1
#   - fused SHARED1000 R@1 < 79% -> does not beat V35 frozen fusion
#
# Run:
#   make train CONFIG=configs/experiments/V55b_subj01_finetune.yaml SUBJECT=subj01

experiment:
  name: "V55b_subj01_finetune"
  description: "V55b: subj01 fine-tuning from V55a with legacy distill + fusion distill + uniformity"
  tags:
    - vmf
    - v55b
    - phase2_finetune
    - dual_head
    - regression
    - token_targets
    - legacy_teacher_distill
    - fusion_distill
    - uniformity
    - pretrained_model_required
    - roadmap_ppr
  parent: "V55a_multi_subject_dual_head"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  split_file: "experimental_results/V55a_multi_subject_dual_head/subj01/split.json"
  exclude_parent_train_from_val: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"
  num_workers: 0

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V55a_multi_subject_dual_head/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  require_parent_split_match: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.20
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.20
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 500.0
    num_tokens: 257
    token_dim: 768
    regression_head: true
  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  uniformity:
    enabled: true
    weight: 0.05
    t: 2.0

  legacy_teacher_distill:
    enabled: false
    weight: 0.15
    teacher_checkpoint_path: "experimental_results/N1v28a_dual_head/subj01/checkpoint_best.pt"
    compact_k: 16
    teacher_k: 16
    teacher_temperature: 0.07
    student_temperature: 0.07
    start_epoch: 5
    teacher_rank_gate: 20

  fusion_ranking_distill:
    enabled: false
    weight: 0.15
    recipe_summary_path: "docs/thesis/results/final_outputs/best_system/final_metrics_summary.json"
    strict_recipe: true
    fallback_recipe:
      compact_score: "csls"
      legacy_score: "csls"
      family: "normalized_weighted"
      normalization: "zscore"
      shortlist_k: 150
      alpha: 0.3
      beta: 0.0
      gamma: 0.7
      expected_shared1000_r@1: 0.772
      saved_shared1000_r@1: 0.772
    compact_topk: 16
    teacher_topk: 32
    teacher_tau: 0.07
    student_tau: 0.07
    gate_max_rank: 20
    topk_overlap_k: 10
    start_epoch: 5
    csls_k: 10
    symmetric: false

  shortlist_teacher_distill:
    enabled: false
  tri_teacher_distill:
    enabled: false
  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 2048

training:
  batch_size: 8
  gradient_accumulation_steps: 32
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 80
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-7
  gradient_clip: 1.0
  early_stop_patience: 20
  early_stop_min_delta: 0.001
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  best_checkpoints: [csls_r@1]
  proxy_val_every_epochs: 1
  proxy_val_num_images: 1024
  full_val_every_epochs: 10
  mc_tta_samples: 1
  kappa_weighted_avg: true
  ppr:
    enabled: true
  two_stage:
    enabled: false
  fusion:
    enabled: false
  tri_fusion:
    enabled: true
    compact_score: "csls"
    legacy_score: "csls"
    family: "normalized_weighted"
    normalization: "zscore"
    shortlist_k: 150
    alpha: 0.3
    beta: 0.0
    gamma: 0.7
    csls_k: 10

inference:
  use_mean_for_retrieval: true
