# Stage 1: Deterministic baseline, fixed K
_base_: ../../../base.yaml

experiment:
  name: det_fixed
  description: "Deterministic decoder + fixed K_base baseline"
  tags: [stage1, deterministic, fixed_k]

clip_embedding:
  space: normalized
  normalize_targets: true
  normalize_predictions: true

decoder:
  type: deterministic
  uncertainty: diag
  predict_logvar: false

loss:
  cosine_weight: 1.0
  mse_weight: 0.0
  infonce_weight: 0.0
  nll_weight: 0.0
  cosine_aux_weight: 0.0
  variance_penalty_weight: 0.0

inference:
  sampling_policy: fixed_k
  K_base: 8
  K_set: [1, 2, 4, 8, 16]
  enforce_budget: true
  selection_rule: cosine

logging:
  level: INFO
