# N1v24b_label_smooth: V24 + label smoothing epsilon=0.05
#
# Hypothesis: N1v24 with hard negatives may still produce overconfident predictions
#             on easy positives (kappa spike). Label smoothing redistributes 5% of
#             positive probability mass uniformly across all negatives, preventing
#             the encoder from assigning near-zero cross-entropy to trivial positives.
#             May improve calibration and generalization without harming top-1 accuracy.
#
# Changes from N1v24_combined:
#   - vmf_nce.label_smoothing: 0.05
# Everything else identical to N1v24_combined.
#
# Epoch-1 sanity: train_vmf_nce slightly higher than N1v24 (smoothed cross-entropy);
#                 kappa should remain 15–25, not significantly lower (that would
#                 indicate over-smoothing).

experiment:
  name: "N1v24b_label_smooth"
  description: "v24b: V24 + label_smoothing=0.05 in vmf_nce"
  tags: ["vmf", "vmf_nce", "v24", "wider_encoder", "csls_training", "hard_negatives", "label_smoothing", "csls", "shared1000"]
  parent: "N1v24_combined"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_csls_training: true
    csls_k: 10
    hard_negative_weight: 0.3
    hard_neg_k: 16
    label_smoothing: 0.05      # NEW: smooths positive target by redistributing 5%

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
