# Configuration for training on REAL NSD data
# Subject 01, Session 1 - Baseline Method

experiment:
  name: "real_baseline_subj01_session1"
  description: "Baseline fMRI-to-CLIP model trained on REAL NSD data from subject 01, session 1"
  tags:
    - baseline
    - real_nsd_data
    - subj01
    - session1
  author: "Bachelor Thesis"

# Data configuration
data:
  subject: "subj01"
  session: 1
  index_path: "data/indices/nsd_index/subject=subj01/index.parquet"
  limit: null  # null = use all available data (750 trials for session 1)
  
# Model architecture
model:
  type: "simple_cnn"
  input_shape: [1, 81, 104, 83]  # NSD fMRI volume shape (channels, height, width, depth)
  output_dim: 512  # CLIP embedding dimension

# Training hyperparameters
training:
  epochs: 20
  batch_size: 16
  lr: 0.0001  # Learning rate
  optimizer: "adam"
  loss: "mse"
  device: "cuda"
  gradient_clip: 1.0  # Gradient clipping threshold
  
# Logging and checkpointing
logging:
  log_interval: 10
  save_checkpoints: true
  checkpoint_interval: 5
  tensorboard: true

# Output directory
output_dir: "/bigdata/userhome/students/md5_sd8f61177fd2312b9b32bd118ad1/runs"

# Random seed for reproducibility
seed: 42
