# EXP7: Von Mises-Fisher NCE  (Novel — principled hyperspherical model)
#
# Uses the geometry-correct vMF decoder with bounded-sigmoid kappa
# parameterisation and Bessel-free vMF-NCE contrastive loss.
#
# Key changes vs EXP4 (Gaussian-NCE):
#   - model.posterior = vmf  → bounded sigmoid kappa in [0.001, 500]
#   - Loss: vMF-NCE (kappa-scaled cosine / tau, no Bessel functions)
#   - Optional kappa regularizer instead of vMF-NLL
#   - Hypothesis: H7: EXP7 > EXP4 for retrieval AND calibration
#                 because the distribution matches the data geometry.

experiment:
  name: "exp7_vmf_nce"
  description: "Von Mises-Fisher model with bounded-sigmoid kappa + vMF-NCE"
  tags: ["vmf", "vmf_nce", "queue", "preprocessing", "novel"]
  parent: "exp4_gaussian_nce"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1
    kappa_min: 0.001
    kappa_max: 500.0

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 0.07
    use_queue: true

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/exp7_vmf_nce"
