# =============================================================================
# Full Training Example Configuration
# =============================================================================
# Complete configuration example for a real training run.
# Demonstrates all available options.
# =============================================================================

# Experiment metadata
experiment_name: full_training_example
description: |
  Complete training configuration example with all options.
  This demonstrates the full capability of the training pipeline.

# Random seed for reproducibility
seed: 42

# Training parameters
num_epochs: 100
batch_size: 64
learning_rate: 0.001
weight_decay: 0.0001
gradient_clip_norm: 1.0

# Learning rate scheduler
scheduler:
  type: cosine  # Options: cosine, step, exponential, plateau
  warmup_epochs: 5
  min_lr: 0.00001

# Device configuration
device: cuda
mixed_precision: true  # Use automatic mixed precision for faster training

# Data parameters
data:
  dataset_type: nsd  # Natural Scenes Dataset
  subject: subj01
  train_split: train
  val_split: val
  test_split: test
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

# Model parameters
model:
  type: two_stage
  encoder:
    type: mlp
    input_dim: 19004  # Number of voxels
    hidden_dims: [2048, 1024, 512]
    output_dim: 768  # CLIP embedding dimension
    activation: relu
    dropout: 0.2
    batch_norm: true
  
  decoder:
    type: clip_adapter
    clip_model: ViT-L/14
    adapter_dim: 512
    num_layers: 4

# Loss function
loss:
  type: combined
  mse_weight: 0.7
  cosine_weight: 0.3

# Optimization
optimizer:
  type: adamw
  betas: [0.9, 0.999]
  eps: 1e-8

# Regularization
regularization:
  dropout: 0.2
  label_smoothing: 0.1
  augmentation: true

# Logging
log_level: INFO
log_interval: 10  # Log every N steps
val_interval: 1  # Validate every N epochs

# Checkpointing
checkpoint_interval: 5  # Save checkpoint every N epochs
save_best_only: true
metric_for_best: val_loss  # Metric to track for best model

# Early stopping
early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001

# Evaluation
evaluation:
  metrics:
    - mse
    - cosine_similarity
    - pearson_correlation
  save_predictions: true
  generate_samples: true
  num_samples: 100

# Resources
resources:
  gpu_memory_fraction: 0.9
  allow_growth: true

# Output directories (override with environment variables)
# runs_dir: /bigdata/userhome/students/<USER>/runs
# cache_dir: /bigdata/userhome/students/<USER>/cache
# checkpoint_dir: /bigdata/userhome/students/<USER>/checkpoints

# Weights & Biases integration (optional)
wandb:
  enabled: false
  project: fmri2img
  entity: null
  tags:
    - two_stage
    - subj01
    - full_pipeline
  notes: |
    Full training run with complete configuration.
