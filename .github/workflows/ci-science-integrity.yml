name: ci-science-integrity
# MINDIR scientific-integrity CI: immutability, historical-N8 firewall, leakage, schema, determinism.
on:
  push:
    paths: ["artifacts/mindcompiler/**", "src/fmri2img/mindcompiler/**", ".github/workflows/ci-science-integrity.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install
        run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Scientific immutability (O2.16 / O2.16-SEC / M0 config hashes)
        run: python -m pytest tests/mindcompiler/prox/test_prox_platform.py -q -k "immutability or firewall"
      - name: Historical-N8 firewall + leakage guards
        run: python -m pytest tests/mindcompiler/moonshot_triad -q -k "locked or firewall or predictor"
      - name: R1 integrity (bug-injection + determinism + numerical)
        run: python -m pytest tests/mindcompiler/r1_release -q
