# =============================================================================
# Ridge Regression Baseline
# =============================================================================
#
# Linear baseline for fMRI -> CLIP embedding mapping. Provides a lower
# bound for all nonlinear models in the ablation ladder.
#
# Usage:
#   python3 scripts/training/train_ridge.py \
#       --config configs/training/ridge_baseline.yaml --subject subj01
# =============================================================================

_base_: ../base.yaml

experiment:
  name: ridge_baseline
  description: "Linear ridge regression baseline"
  tags: [baseline, linear]

dataset:
  subject: subj01
  max_trials: 30000

preprocessing:
  reliability_threshold: 0.1
  pca_k: 512
  enable_pca: true

ridge:
  alpha: 1000.0
  alpha_search: true
  alpha_range: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  cv_folds: 5
  solver: auto
  fit_intercept: true

output:
  checkpoint_path: "checkpoints/ridge/${dataset.subject}/ridge.pkl"

evaluation:
  compute_retrieval: true
  gallery_sizes: [10, 50, 100, 500, 1000]
