# EXP9: Per-ROI Directional Experts with Spherical Consensus Fusion (ROI-DCF)
#
# Extends EXP8 (ROI Transformer + vMF) by replacing the single-head vMF
# decoder with per-ROI vMF prediction heads fused via the spherical
# weighted mean (Mardia & Jupp, 2000).
#
# Key changes vs EXP8:
#   - model.type = vmf_dcf (per-ROI vMF heads + consensus fusion)
#   - Multi-task loss: fused vMF-NCE + auxiliary per-ROI vMF-NCE
#   - Disagreement-aware UA-CFG for diffusion inference
#   - Per-ROI interpretability: each brain region predicts its own direction
#
# Ablation variants:
#   - exp9a: shared per-ROI heads (default)
#   - exp9b: independent per-ROI heads (set dcf.shared_heads: false)
#   - exp9c: + disagreement-aware UA-CFG

experiment:
  name: "exp9_roi_dcf"
  description: "ROI-DCF: Per-ROI vMF Experts with Spherical Consensus Fusion"
  tags: ["roi_dcf", "vmf", "vmf_nce", "multi_task", "interpretable", "novel"]
  parent: "exp8_roi_transformer"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null  # Filled at runtime from NSD atlas masks
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.1
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_min: 0.001
    kappa_max: 500.0
    dropout: 0.1
    dcf:
      shared_heads: true          # Shared weights across ROI heads (set false for exp9b)
      hidden_dim: null            # No hidden layer in per-ROI heads (d_model -> output_dim directly)
      return_per_roi: true        # Return per-ROI predictions for multi-task loss and analysis

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 0.07
    use_queue: true

  # Multi-task auxiliary loss for per-ROI vMF-NCE
  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.5              # Weight for per-ROI auxiliary loss

  vmf_nll:
    enabled: false               # Disabled; vMF-NCE is the main contrastive objective
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01           # Penalise unbounded kappa growth

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16  # Effective batch size = 64
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 3.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 20

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42
  # Disagreement-aware UA-CFG
  ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma: 1.0
    steps_min: 10
    steps_max: 50
    delta_beta: 0.5              # Disagreement penalty: confidence = kappa_norm * (1 - beta * delta)

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  compute_per_roi_analysis: true  # NEW: per-ROI direction and kappa analysis
  seed: 42

paths:
  output_dir: "experimental_results/exp9_roi_dcf"
