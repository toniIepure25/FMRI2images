# N4v6: Full System -- v6 novel loss improvements
#
# Changes from N4v5:
#   - vmf_nce_spcl.use_delta: true (Delta-SPCL: disagreement-aware curriculum)
#   - vmf_nce_spcl.delta_weight: 10.0 (scaling for inter-ROI disagreement penalty)
#   - softclip.vmf_mode: true (vMF-SoftCLIP: kappa as dynamic student temperature)
#   - softclip.teacher_tau: 0.05 (explicit teacher temperature)
#   - mixco.use_slerp: true (spherical interpolation for CLIP targets)

experiment:
  name: "N4v6_full_system"
  description: "v6 flagship: Delta-SPCL + vMF-SoftCLIP + Slerp MixCo"
  tags: ["roi_dcf", "vmf", "mixture", "dual_ua_cfg", "ceiling", "spcl", "delta_spcl", "full_system", "flagship", "v6"]
  parent: "N4v5_full_system"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_min: 1.0
    kappa_max: 50.0
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: false

loss:
  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    use_delta: true
    delta_weight: 10.0
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"
  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.3
  kappa_reg:
    enabled: false
    lambda_kappa: 0.02
  softclip:
    enabled: true
    weight: 1.0
    vmf_mode: true
    teacher_tau: 0.05
    use_queue: true
    symmetric: true
  vmf_nce:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  num_epochs: 150
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 25
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
    use_slerp: true
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v6_full_system"
