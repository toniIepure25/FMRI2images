# N3v2: Improved ROI-DCF
#
# Changes from N3:
#   - dropout: 0.1 -> 0.3 (v1 overfits severely: val_loss 3.5 -> 10.4)
#   - weight_decay: 0.05 -> 0.1 (high-capacity model needs strong L2)
#   - kappa_reg.lambda_kappa: 0.01 -> 0.1
#   - kappa_max: 100 -> 50
#   - lr: 3e-4 -> 1e-4 (slower convergence for complex model)
#   - warmup_epochs: 10 -> 15
#
# Rationale: v1 4-layer ROI transformer + per-ROI DCF heads have very
# high capacity, causing severe overfitting from epoch 2. Aggressive
# regularization needed.

experiment:
  name: "N3v2_roi_dcf"
  description: "Improved ROI-DCF: aggressive regularization, lower LR"
  tags: ["roi_dcf", "vmf", "vmf_nce", "multi_task", "interpretable", "novel", "v2"]
  parent: "N2v2_roi_transformer"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.3
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_min: 1.0
    kappa_max: 50.0
    dropout: 0.3
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 0.07
    use_queue: true

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.5

  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.1

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 20

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42
  ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma: 1.0
    steps_min: 10
    steps_max: 50
    delta_beta: 0.5

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  compute_per_roi_analysis: true
  seed: 42

paths:
  output_dir: "experimental_results/N3v2_roi_dcf"
