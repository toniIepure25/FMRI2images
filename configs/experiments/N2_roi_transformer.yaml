# N2: ROI-Tokenized Transformer Encoder  (Novel — brain-topology-aware)
#
# Replaces the flat MLP encoder with a brain-region-aware Transformer
# that tokenises fMRI voxels by anatomical ROI and uses cross-ROI
# attention to aggregate information.
#
# Combined with the vMF decoder from N1, this represents the full
# proposed architecture.
#
# Key changes vs N1:
#   - encoder_type = roi_transformer
#   - ROI tokenisation over NSD visual ROIs
#   - Provides interpretability via attention weights

experiment:
  name: "N2_roi_transformer"
  description: "ROI-Tokenized Transformer + vMF-NCE"
  tags: ["roi_transformer", "vmf", "vmf_nce", "interpretable", "novel"]
  parent: "N1_vmf_nce"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

model:
  type: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.1
    activation: "gelu"
  decoder:
    input_dim: 512
    output_dim: 768
    hidden_dims: [1024]
    activation: "gelu"
    dropout: 0.1
    log_kappa_min: 0.0
    log_kappa_max: 4.6

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  vmf_nll:
    enabled: true
    weight: 1.0
    dim: 768

  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    use_queue: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 3e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 20

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  seed: 42

paths:
  output_dir: "experimental_results/N2_roi_transformer"
