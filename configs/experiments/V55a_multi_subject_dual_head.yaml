# V55a: Multi-Subject Dual-Head with Uniformity Regularization (Phase 1)
#
# Hypothesis: The primary bottleneck is data volume combined with gradient
# dilution from the vmf_triple 3-head architecture. Simplifying to N1v28a-
# style dual-head (L2-norm contrastive + un-normalised regression) while
# training on 4 subjects (~36K unique images, 4x single-subject) should
# close much of the 16pp gap to MindEye.
#
# Key design choices vs V54a:
#   - model.type: "vmf" (dual-head) instead of "vmf_triple" (3-head)
#     -> eliminates rerank head, focuses all gradient on retrieval + regression
#   - decoder.regression_head: true (MindEye-style dual-head)
#     -> MSE on un-normalised predictions + contrastive on L2-normalised mu
#   - loss.uniformity: enabled (Wang & Isola, 2020)
#     -> addresses hubness intrinsically during training, not just post-hoc CSLS
#   - Token-level targets: 257 x 768 = 197376-D (like N1v28a legacy expert)
#     -> preserves fine-grained discriminative structure
#
# Phase 2 (V55b) will fine-tune subj01 with legacy distillation.
#
# Kill criteria:
#   - subj01 val CSLS R@1 < 55% after 40 epochs -> abort (data scale not enough)
#   - hubness (raw/CSLS gap) > 15pp after 40 epochs -> uniformity too weak
#
# Run:
#   make train CONFIG=configs/experiments/V55a_multi_subject_dual_head.yaml

experiment:
  name: "V55a_multi_subject_dual_head"
  description: "V55a: 4-subject dual-head vMF (no triple-head) + uniformity regularization (Route 1+2+6)"
  tags:
    - vmf
    - v55a
    - multi_subject
    - cross_subject
    - dual_head
    - regression
    - token_targets
    - uniformity
    - anti_hubness
    - phase1_pretrain
    - 4subject
    - data_scaling
    - roadmap_ppr
  parent: "N1v28a_dual_head"

data:
  subjects: [subj01, subj02, subj05, subj07]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  exclude_parent_train_from_val: true
  normalize_fmri: true
  average_repetitions: false
  one_trial_per_image_per_epoch: true
  max_unique_images_per_epoch: 40000
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  require_pretrained_model: false
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.20
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.20
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 500.0
    num_tokens: 257
    token_dim: 768
    regression_head: true
  projection_head:
    enabled: false
  cross_subject:
    enabled: true
    canonical_subject: subj01
    freeze_epochs: 10
    backbone_lr_factor: 0.15

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  uniformity:
    enabled: true
    weight: 0.1
    t: 2.0

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 4096

training:
  batch_size: 16
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 120
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 12
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 25
  early_stop_min_delta: 0.001
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  best_checkpoints: [csls_r@1]
  proxy_val_every_epochs: 1
  proxy_val_num_images: 2048
  full_val_every_epochs: 3
  mc_tta_samples: 4
  kappa_weighted_avg: true
  ppr:
    enabled: true
  two_stage:
    enabled: false
  fusion:
    enabled: false
  tri_fusion:
    enabled: false

inference:
  use_mean_for_retrieval: true
