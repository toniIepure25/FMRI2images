# V65a: MLP Encoder + V9 Loss Recipe (SPCL, R-Drop, Projection Head)
#
# Track A of "Path to 90%+" plan.
# Same MLP architecture as V61a (pretrained from V60a), but with the full
# V9 innovation stack that was NEVER used in V60-V64:
#   - Projection head (768->2048->768): separates contrastive from retrieval
#   - R-Drop (weight=0.5, start epoch 15): vMF divergence regularization
#   - Uniformity loss (weight=0.1): prevents embedding collapse
#   - Label smoothing (0.05): smoothed CE in vMF-NCE
#   - regression_mse weight 1.0 (2x V61a): stronger token alignment
#   - SoftCLIP weight 0.3 (vs V61a's 1.0): reduced per N4v9 design
#   - Effective batch 512 (32 x 16): 2x V61a
#
# V61a achieved 79.1% CSLS R@1 on shared1000 without these features.
# Target: 81-83% CSLS R@1 single model.

experiment:
  name: "V65a_mlp_v9_recipe"
  description: "v65a: MLP + V9 loss recipe (R-Drop, proj head, uniformity, label smoothing)"
  tags: ["vmf", "vmf_nce", "v65", "finetune", "single_subject", "dual_head",
         "regression", "token_targets", "197k", "csls", "shared1000",
         "differential_lr", "projection_head", "rdrop", "uniformity"]
  parent: "V60a_cross_subject_197k"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"

model:
  type: "vmf"
  posterior: "vmf"
  pretrained_model_path: "experimental_results/V60a_cross_subject_197k/subj01/checkpoint_best.pt"
  require_pretrained_model: true
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.20
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: null
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.25
    kappa_mode: "softplus"
    num_tokens: 257
    token_dim: 768
    regression_head: true

  projection_head:
    enabled: true
    hidden_dim: 2048
    out_dim: 768
    dropout: 0.1

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    label_smoothing: 0.05

  regression_mse:
    enabled: true
    weight: 1.0

  softclip:
    enabled: true
    weight: 0.3
    tau: 0.05
    vmf_mode: true
    use_queue: true
    symmetric: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: true
    weight: 0.5
    start_epoch: 15

  uniformity:
    enabled: true
    weight: 0.1

  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 32
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    encoder_lr: 3.0e-6
    decoder_lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-7
  gradient_clip: 1.0
  early_stop_patience: 50
  early_stop_min_delta: 0.001
  train_r1_interval: 5
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 16
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
