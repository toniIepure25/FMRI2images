# N2v12: ROI Transformer — Two-Stage Training + Kappa Cap + Wider FFN
#
# V12 strategy: address four root causes of the V10/V11 ~51% R@1 ceiling.
#
# Root cause fixes:
#   1. average_repetitions: false (V11 reduced data 3x)
#   2. kappa_max: 50 (prevents kappa explosion >100)
#   3. Two-stage training: contrastive (1-120) then vMF-NLL (120+)
#   4. Clean loss recipe (no V11 additions)
#
# Additional improvements:
#   - dim_feedforward: 8192 (up from 4096)
#   - Effective batch 512 (grad_accum 8)
#   - LR scaled by sqrt(2) for doubled effective batch

experiment:
  name: "N2v12_roi_transformer"
  description: "v12 ROI Transformer: two-stage training + kappa cap + wider FFN + eff. batch 512"
  tags: ["roi_transformer", "vmf", "vmf_nce", "interpretable", "novel", "v12",
         "multi_subject", "softplus", "csls", "mc_tta", "hard_neg", "model_soup",
         "two_stage", "kappa_cap", "wider_ffn"]
  parent: "N2v10_roi_transformer"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 1024
    nhead: 16
    num_layers: 6
    dim_feedforward: 8192
    dropout: 0.2
    activation: "gelu"
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1024]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
    kappa_max: 50.0

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    hard_negative_weight: 0.5
    hard_neg_k: 16

  vmf_nll:
    enabled: true
    weight: 0.0
    dim: 768

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 65536

training:
  batch_size: 64
  gradient_accumulation_steps: 8
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 7.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  save_frequency: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999
  stage2:
    enabled: true
    start_epoch: 120
    lr_factor: 0.1
    vmf_nll_weight: 2.0
    softclip_weight: 0.3
    vmf_nce_weight: 0.0
    mixco_enabled: false
    patience: 20

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  model_soup: true
  soup_top_k: 5
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  seed: 42

paths:
  output_dir: "experimental_results/N2v12_roi_transformer"
