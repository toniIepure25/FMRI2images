# N2v21: ROI Transformer — vMF-enhanced + ISF anti-hubness + batch 1024
#
# Base: N2v17_roi_transformer.yaml (40.3% raw / 46.9% CSLS R@1)
# V21 changes (vMF-centric, no encoder change):
#   1. learnable_temperature: false (let kappa be the sole per-sample temperature)
#   2. vmf_nll auxiliary loss (w=0.1) for principled kappa calibration
#   3. isf_weight: 0.3 (train-time anti-hubness via inverted softmax)
#   4. batch 128 x grad_accum 8 = effective 1024 (4x V17)

experiment:
  name: "N2v21_roi_transformer"
  description: "v21 ROI Transformer: kappa calibration + ISF + batch 1024"
  tags: ["roi_transformer", "vmf", "vmf_nce", "interpretable", "novel", "v21",
         "multi_subject", "softplus", "csls", "shared1000", "mc_tta", "isf", "vmf_nll"]
  parent: "N2v17_roi_transformer"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
  decoder:
    input_dim: 768
    output_dim: 768
    hidden_dims: [1024]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: false
    isf_weight: 0.3

  vmf_nll:
    enabled: true
    weight: 0.1

  kappa_reg:
    enabled: false

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 128
  gradient_accumulation_steps: 8
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 1.5e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  eval_shared1000: true
  checkpoint_metric: "r@1"
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  seed: 42

paths:
  output_dir: "experimental_results/N2v21_roi_transformer"
