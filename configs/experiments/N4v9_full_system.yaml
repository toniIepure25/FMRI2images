# N4v9: Full System — Anti-Overfit + Projection Head + CSLS + Larger Batch + TTA
#
# V9 targeted interventions over V8:
#   - Stochastic Depth (drop_path_rate=0.15) in Transformer
#   - ContrastiveProjectionHead (768->2048->768) for SoftCLIP/MixCo only;
#     vMF-NCE/SPCL uses raw pred for proper kappa gradient flow
#   - kappa_reg restored to 0.01 (matching V7)
#   - R-Drop regularization (weight=0.5, delayed to epoch 15)
#   - CSLS-corrected retrieval evaluation
#   - MC-Dropout TTA (8 samples) + kappa-weighted repetition averaging
#   - Simplified loss: disable hierarchical_clip, CKA, multitask
#   - SoftCLIP weight reduced to 0.3
#   - Effective batch 512 (128 x 4 grad_accum), LR scaled 2x on H100
#   - Uses SPCL for kappa-curriculum (N4 signature)

experiment:
  name: "N4v9_full_system"
  description: "v9 flagship: anti-overfit + projection head + CSLS + TTA + SPCL"
  tags: ["roi_dcf", "vmf", "spcl", "v9", "multi_subject", "softplus",
         "drop_path", "projection_head", "csls", "rdrop", "mc_tta", "flagship"]
  parent: "N4v8_full_system"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
    drop_path_rate: 0.15
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true
  projection_head:
    enabled: true
    hidden_dim: 2048
    out_dim: 768
    dropout: 0.1

preprocessing:
  enabled: false

loss:
  vmf_nce_spcl:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    initial_curriculum_t: 50.0
    final_curriculum_t: 1.0
    warmup_epochs: 15
    anneal_strategy: "cosine"

  softclip:
    enabled: true
    weight: 0.3
    tau: 0.05
    use_queue: true
    symmetric: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: true
    weight: 0.5
    start_epoch: 15

  # Disabled in V9 (loss surgery)
  vmf_nce:
    enabled: false
  vmf_nce_multitask:
    enabled: false
  hierarchical_clip:
    enabled: false
  cka:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 128
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 2.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  seed: 42
  mixture_sampling:
    enabled: true
    num_samples: 8
    strategy: "proportional"
    selection: "closest_to_consensus"
  decomposed_ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma_w: 1.0
    k_min: 1
    k_max: 8
    delta_threshold_low: 0.2
    delta_threshold_high: 0.6
    steps_min: 10
    steps_max: 50
    gamma_steps: 0.5
    abstain_kappa_quantile: 0.05
    abstain_delta_threshold: 0.85

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_per_roi_analysis: true
  compute_mixture_energy_score: true
  compute_risk_coverage: true
  compute_ceiling_normalized: true
  seed: 42

paths:
  output_dir: "experimental_results/N4v9_full_system"
