# B1: Probabilistic Gaussian Baseline
#
# Strongest possible baseline using Gaussian uncertainty modeling.
# Extends B0 with heteroscedastic Gaussian NLL, distribution-aware
# Gaussian-NCE contrastive loss, and KL annealing with free-bits.
#
# This is the direct comparison target for N1 (vMF-NCE), isolating
# the effect of the distributional assumption: Gaussian in R^d vs
# vMF on S^{d-1}.
#
# Merges: old EXP3 (Gaussian NLL) + EXP4 (Gaussian-NCE) + EXP5 (KL)

experiment:
  name: "B1_gaussian"
  description: "Probabilistic Gaussian baseline: Gaussian-NCE + KL annealing"
  tags: ["baseline", "gaussian", "probabilistic", "pcr", "queue"]

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

model:
  type: "gaussian"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1
    output_logvar: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  whiten_eps: 1.0e-5
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  gaussian_nll:
    enabled: true
    weight: 1.0
    logvar_min: -10.0
    logvar_max: 5.0
    reduction: "mean"
  gaussian_nce:
    enabled: true
    weight: 1.0
    temperature: 1.0
    use_queue: true
    symmetric: false
    clamp_logvar: true
    logvar_min: -10.0
    logvar_max: 5.0
  kl:
    enabled: true
    weight_start: 0.0
    weight_end: 0.001
    anneal_steps: 10000
    anneal_type: "linear"
    free_bits: 0.5
    free_bits_type: "dimension"
  infonce:
    enabled: false
  mse:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/B1_gaussian"
