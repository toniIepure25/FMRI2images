# NeuroBridge-OT: No Hyper-Adapter — Standard learned tokenizer without fingerprint modulation
# Taxonomy: multi_subject_seen_subject
# Hypothesis 4: Hyper-adapters improve data efficiency for new subjects

experiment:
  name: "neurobridge_ot_no_hyperadapter"
  description: "NeuroBridge-OT without hyper-adapter (no fingerprint modulation)"
  tags: ["neurobridge_ot", "ablation", "no_hyperadapter"]

protocol:
  taxonomy_label: "multi_subject_seen_subject"
  training_subjects: ["subj01", "subj02", "subj05", "subj07"]
  evaluation_subjects: ["subj01", "subj02", "subj05", "subj07"]

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  split_by_image: true
  exclude_shared1000: true
  val_ratio: 0.10
  embedding_column: "fused"
  seed: 42

model:
  type: "neurobridge_ot"
  d_model: 768
  output_dim: 768
  n_rois: 17
  n_canonical_tokens: 17
  use_fingerprint: false  # Disabled
  use_hyper_adapter: false  # Disabled
  tokenizer:
    type: "learned"
    n_rois: 17
    d_model: 768
    n_attn_heads: 4
    dropout: 0.1
    roi_dropout: 0.1
  optimal_transport:
    alignment_mode: "ot"
    epsilon: 0.1
    n_sinkhorn_iters: 50
    cost_type: "cosine"
  transformer:
    n_heads: 12
    n_layers: 6
    dim_feedforward: 3072
    dropout: 0.1
    drop_path_rate: 0.15
  heads:
    d_model: 768
    output_dim: 768
    use_vmf_head: true
    kappa_min: 0.001
    kappa_max: 500.0

loss:
  w_contrastive: 1.0
  w_regression: 0.5
  w_teacher: 0.3
  w_ot: 0.1
  w_shared: 0.1
  w_adversarial: 0.1
  w_vmf: 0.3
  contrastive:
    temperature: 0.07
    symmetric: true
  vmf:
    kappa_reg_weight: 0.1
    target_kappa: 50.0
  adversarial:
    d_model: 768
    n_subjects: 8
    grl_lambda: 1.0

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 8
  amp: true
  mixed_precision_dtype: "bf16"
  patience: 30
  warmup_epochs: 5

paths:
  output_dir: "experimental_results/neurobridge_ot_no_hyperadapter"
