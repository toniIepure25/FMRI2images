# or
#   python scripts/run_experiment.py --exp experiments/smoke_subj01.yaml
experiment:
  name: smoke_subj01
  subject: subj01
  mode: baseline
  dry_run: true
  skip_eval: true
  force_rebuild: false
  resume_from: null
  root_dir: .
