# N2v5: ROI-Tokenized Transformer — v5 training recipe + architecture scaling
#
# Changes from N2v4:
#   - d_model: 768 (was 512, now matches CLIP embedding dim)
#   - nhead: 12 (was 8, 768/12=64 per head)
#   - num_layers: 6 (was 4, deeper cross-ROI reasoning)
#   - dim_feedforward: 3072 (4x d_model)
#   - decoder.input_dim: 768 (match encoder output)
#   - gradient_accumulation_steps: 4 (effective batch 256)
#   - lr: 5e-5 (kept lower for transformer stability)
#   - warmup_epochs: 15
#   - weight_decay: 0.05
#   - dropout: 0.2
#   - num_epochs: 150
#   - early_stop_patience: 25
#   - softclip_from_start: true
#   - fmri_noise_std: 0.1
#   - voxel_dropout: 0.1
#   - ema.enabled: true
#   - vmf_nce.learnable_temperature: true
#   - vmf_nce.tau: 1.0 (kappa IS the inverse temperature; tau=0.07 caps kappa gradient at ~5.6)
#   - kappa_reg: disabled (contrastive loss naturally balances kappa)

experiment:
  name: "N2v5_roi_transformer"
  description: "v5 ROI Transformer: d_model=768, 6 layers, larger batch, noise aug, EMA"
  tags: ["roi_transformer", "vmf", "vmf_nce", "interpretable", "novel", "v5"]
  parent: "N2v4_roi_transformer"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  seed: 42

model:
  type: "vmf"
  encoder:
    encoder_type: "roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
  decoder:
    input_dim: 768
    output_dim: 768
    hidden_dims: [1024]
    activation: "gelu"
    dropout: 0.2
    log_kappa_min: 0.0
    log_kappa_max: 4.0

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: false
    lambda_kappa: 0.1

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  num_epochs: 150
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 25
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  seed: 42

paths:
  output_dir: "experimental_results/N2v5_roi_transformer"
