# Stage 1: Probabilistic decoder, fixed K
_base_: ../../../base.yaml

experiment:
  name: prob_fixed
  description: "Probabilistic decoder + fixed K_base (likelihood selection)"
  tags: [stage1, probabilistic, fixed_k]

clip_embedding:
  space: normalized
  normalize_targets: true
  normalize_predictions: true

decoder:
  type: probabilistic
  uncertainty: diag
  predict_logvar: true
  logvar_min: -8.0
  logvar_max: 2.0
  variance_floor: 1.0e-6

loss:
  cosine_weight: 0.0
  mse_weight: 0.0
  infonce_weight: 0.0
  nll_weight: 1.0
  cosine_aux_weight: 0.1
  variance_penalty_weight: 0.01
  nll_reduction: mean
  logvar_min: -8.0
  logvar_max: 2.0
  variance_floor: 1.0e-6

inference:
  sampling_policy: fixed_k
  K_base: 8
  K_set: [1, 2, 4, 8, 16]
  enforce_budget: true
  selection_rule: likelihood

logging:
  level: INFO
