# =============================================================================
# Fast Development Configuration
# =============================================================================
#
# Minimal config for rapid iteration, debugging, and sanity checks.
# Uses reduced data, small model, and few epochs.
#
# NOT for paper experiments — use configs/experiments/exp*.yaml instead.
#
# Usage:
#   python3 scripts/training/train_unified.py \
#       --config configs/training/dev_fast.yaml --gpu 0
# =============================================================================

_base_: ../base.yaml

experiment:
  name: dev_fast
  description: "Fast development loop — sanity checks only"
  tags: [development, fast, debugging]

dataset:
  subject: subj01
  max_trials: 1000

preprocessing:
  reliability_threshold: 0.0
  pca_k: 256
  enable_pca: true

model:
  type: "deterministic"
  encoder:
    encoder_type: "mlp"
    input_dim: 256
    hidden_dims: [512, 256]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 256
    output_dim: 768
    hidden_dims: [512]
    activation: "gelu"
    dropout: 0.1

loss:
  mse:
    enabled: true
    weight: 1.0

training:
  batch_size: 32
  num_epochs: 10
  optimizer:
    type: "adam"
    lr: 1.0e-3
    weight_decay: 0.0
  warmup_epochs: 0
  min_lr: 1.0e-3
  gradient_clip: null
  mixed_precision: false
  early_stop_patience: 3

evaluation:
  gallery_sizes: [2, 10]
  compute_probabilistic: false
  seed: 42

logging:
  level: WARNING

paths:
  output_dir: "outputs/dev_fast"
