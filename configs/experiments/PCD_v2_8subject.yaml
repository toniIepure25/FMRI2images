# PCD_v2: Predictive Cortical Decoder — Anti-Overfitting Overhaul
#
# v1 diagnosis: 167M params, train R@1=99.8% but val R@1=18% (82% gap).
# Root causes: (1) 96M params in per-subject ROI projections memorize
# subject-specific shortcuts, (2) dropout=0.1 everywhere, (3) weak
# augmentation, (4) R-Drop started too late.
#
# v2 changes vs v1:
#   - d_model: 768 → 512 (−55% transformer params)
#   - layers_per_level: 2 → 1 (halves transformer depth)
#   - nhead: 12 → 8 (maintains 64 dim/head)
#   - bottleneck_dim: 128 (ROI proj: n_voxels → 128 → 512, −4x params)
#   - dropout: 0.1 → 0.4 everywhere
#   - weight_decay: 0.05 → 0.1
#   - fmri_noise_std: 0.1 → 0.5
#   - voxel_dropout: 0.1 → 0.25
#   - label_smoothing: 0.05 → 0.2
#   - kappa_reg: 0.01 → 0.1
#   - R-Drop from epoch 0 (was 15), weight 1.0 (was 0.5)
#   - lr: 1e-4 → 5e-5
#   - warmup: 15 → 10 epochs
#
# Estimated params: ~45M (down from 167M)

experiment:
  name: "PCD_v2_8subject"
  description: "PCD v2 — reduced capacity + aggressive regularization for 8-subject joint pretraining"
  tags: ["pcd", "predictive_coding", "vmf", "8subject", "hierarchy", "anti_overfit", "v2"]

data:
  subjects:
    - subj01
    - subj02
    - subj03
    - subj04
    - subj05
    - subj06
    - subj07
    - subj08
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "pcd"
  posterior: "vmf"

  encoder:
    roi_dims:
      V1v: 500
      V1d: 500
      V2v: 500
      V2d: 500
      V3v: 400
      V3d: 400
      V3A: 300
      V3B: 300
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 300
      OFA: 200
      OPA: 200
      RSC: 200
      nsdgeneral_other: 10000

  decoder:
    output_dim: 768
    kappa_min: 0.001
    kappa_max: 500.0
    kappa_mode: "softplus"

  pcd:
    d_model: 512
    nhead: 8
    layers_per_level: 1
    dropout: 0.4
    bottleneck_dim: 128
    enable_per_level_kappa: true
    ablation_mode: "full"

  cross_subject:
    enabled: true

  projection_head:
    enabled: true
    hidden_dim: 1536
    out_dim: 768
    dropout: 0.4

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    label_smoothing: 0.2

  softclip:
    enabled: true
    weight: 0.3
    tau: 0.05
    use_queue: true
    symmetric: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.1

  r_drop:
    enabled: true
    weight: 1.0
    start_epoch: 0

  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 128
  gradient_accumulation_steps: 8
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.1
    betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  fmri_noise_std: 0.5
  voxel_dropout: 0.25
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.2
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/PCD_v2_8subject"
