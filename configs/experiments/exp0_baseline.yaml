# EXP0: Deterministic Baseline (No Preprocessing, No Queue, No Uncertainty)
#
# Reference point for the entire ablation ladder. Deterministic MLP encoder
# with MSE + InfoNCE losses, no embedding preprocessing, no memory queue.
#
# Hypothesis: H0: This provides a fair lower bound. Each subsequent
#             experiment (EXP1-EXP14) should improve on at least one
#             metric dimension.

experiment:
  name: "exp0_baseline"
  description: "Deterministic MLP baseline with MSE + InfoNCE"
  tags: ["baseline", "deterministic"]

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  type: "deterministic"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.1
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.1

preprocessing:
  enabled: false

loss:
  mse:
    enabled: true
    weight: 1.0
  infonce:
    enabled: true
    weight: 1.0
    temperature: 0.07
    learnable_temperature: true
    symmetric: true
    use_queue: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: false

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 0
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: false
  seed: 42

paths:
  output_dir: "experimental_results/exp0_baseline"
