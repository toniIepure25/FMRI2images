# =============================================================================
# Production Inference Configuration
# =============================================================================
#
# Optimized config for generating images from brain activity predictions.
# Balances quality, speed, and resource usage.
#
# Phase 2 models output 768-D ViT-L/14 embeddings directly — no adapter
# needed (Phase 1 encoders still need the adapter; see adapter_vitl14.yaml).
#
# Usage:
#   python3 scripts/reconstruction/decode_diffusion.py \
#       --config configs/inference/production.yaml \
#       --checkpoint path/to/best_model.pt \
#       --subject subj01
# =============================================================================

_base_: ../base.yaml

experiment:
  name: production_inference
  description: "Production diffusion generation from brain embeddings"
  tags: [production, inference]

# Encoder — filled at runtime via CLI --checkpoint
model:
  encoder_checkpoint: null
  use_preprocessing: true
  device: cuda
  dtype: float32

# Diffusion generation
diffusion:
  model_id: "sd2-community/stable-diffusion-2-1"
  num_inference_steps: 50
  guidance_scale: 7.5
  scheduler: euler
  eta: 0.0
  output_size: 768
  output_format: png

  enable_attention_slicing: true
  enable_vae_slicing: true
  enable_cpu_offload: false
  use_tf32: true

# Uncertainty-Aware CFG (Phase 2 — used when model provides kappa/delta)
ua_cfg:
  enabled: false
  w_min: 2.0
  w_max: 12.0
  gamma_w: 1.5
  k_min: 1
  k_max: 8
  delta_threshold_low: 0.1
  delta_threshold_high: 0.6
  steps_min: 30
  steps_max: 150
  abstention_kappa_min: 5.0

# Batch processing
batch_processing:
  batch_size: 1
  max_batch_size: 4
  auto_batch_size: true
  show_progress: true

# Output
output:
  output_dir: "outputs/generations/${dataset.subject}"
  save_embeddings: true
  save_images: true
  save_metadata: true
  filename_pattern: "{index:05d}_{nsd_id}"

evaluation:
  compute_metrics: true
  metrics: [clip_score, ssim, pixcorr]
  reference_dir: "cache/stimuli/nsd"
  save_comparisons: true

cache:
  preprocessor_dir: "cache/preproc"
  clip_cache_dir: "cache/clip_embeddings"
  low_cpu_mem_usage: true

error_handling:
  skip_on_error: true
  max_retries: 3
  save_error_log: true

logging:
  level: INFO
  log_every_n: 10
