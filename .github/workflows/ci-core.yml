name: ci-core
# MINDIR core CI: install, lint, type-check, unit/property/metamorphic tests, CLI smoke.
on:
  push:
    paths: ["src/fmri2img/mindcompiler/**", "tests/mindcompiler/**", "pyproject.toml", ".github/workflows/ci-core.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check (black)
        run: black --check src/fmri2img/mindcompiler/prox tests/mindcompiler/prox || true   # advisory
      - name: Lint (ruff)
        run: ruff check src/fmri2img/mindcompiler/prox tests/mindcompiler/prox || true       # advisory
      - name: Type check (mypy)
        run: mypy src/fmri2img/mindcompiler/prox || true                                     # advisory
      - name: Unit / property / metamorphic tests
        run: python -m pytest tests/mindcompiler/prox tests/mindcompiler/moonshot_triad -q
      - name: CLI smoke
        run: |
          mindir version
          mindir metrics
          mindir validate
