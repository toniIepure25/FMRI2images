# NeuroBridge-OT: 8-Subject Few-Shot Adaptation
# Taxonomy: supervised_few_shot_adaptation / data_efficiency_transfer
# PRIMARY FEW-SHOT PROTOCOL — All 8 subjects as potential targets

experiment:
  name: "neurobridge_ot_8subj_fewshot"
  description: "NeuroBridge-OT 8-subject few-shot adaptation (pretrain on 7, adapt to target)"
  tags: ["neurobridge_ot", "8subj", "fewshot", "adaptation", "transfer"]

protocol:
  taxonomy_label: "supervised_few_shot_adaptation"
  all_subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  # target_subject: set per-fold by run_fewshot_adaptation.py
  # source_subjects: all_subjects minus target_subject
  few_shot_sizes: [10, 25, 50, 100, 250, 500, 1000, "full"]
  target_subject_seen_during_training: false  # During pretraining
  target_calibration_fmri_used: true  # Fingerprint computed from target
  target_labels_used: true  # Few-shot labels used during adaptation
  target_adapter_fitted: true
  target_learned_parameters_used: true

data:
  subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  split_by_image: true
  exclude_shared1000: true
  val_ratio: 0.10
  embedding_column: "fused"
  seed: 42

model:
  type: "neurobridge_ot"
  d_model: 768
  output_dim: 768
  n_rois: 17
  n_canonical_tokens: 17
  use_fingerprint: true
  use_hyper_adapter: true

  tokenizer:
    type: "hyper_adapter"  # Fingerprint-modulated tokenizer
    n_rois: 17
    d_model: 768
    fingerprint_dim: 128
    n_attn_heads: 4
    dropout: 0.1
    roi_dropout: 0.1
    max_voxels_per_roi: 2000

  fingerprint:
    fingerprint_dim: 128
    n_subjects: 8
    use_subject_embedding: false  # No subject embedding for unseen target

  optimal_transport:
    alignment_mode: "ot"
    epsilon: 0.1
    n_sinkhorn_iters: 50
    cost_type: "cosine"
    use_anatomical_prior: false

  transformer:
    n_heads: 12
    n_layers: 6
    dim_feedforward: 3072
    dropout: 0.1
    drop_path_rate: 0.15
    n_subjects: 8
    use_subject_embedding: false
    activation: "gelu"
    gradient_checkpointing: false

  heads:
    d_model: 768
    output_dim: 768
    dropout: 0.1
    use_token_head: false
    use_vmf_head: true
    use_calibration_head: false
    kappa_min: 0.001
    kappa_max: 500.0

  hyper_adapter:
    adapter_type: "film"
    hidden_dim: 512

loss:
  w_contrastive: 1.0
  w_regression: 0.5
  w_token: 0.0
  w_teacher: 0.0
  w_ot: 0.15
  w_shared: 0.15
  w_adversarial: 0.15
  w_vmf: 0.3
  w_calibration: 0.0

  contrastive:
    temperature: 0.07
    symmetric: true

  vmf:
    kappa_reg_weight: 0.1
    target_kappa: 50.0

  adversarial:
    d_model: 768
    n_subjects: 8
    hidden_dim: 256
    grl_lambda: 1.0

  shared_consistency:
    margin: 0.8

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 8
  amp: true
  mixed_precision_dtype: "bf16"
  patience: 30
  warmup_epochs: 5

adaptation:
  mode: "supervised_fewshot"
  epochs: 50
  lr: 5.0e-5
  patience: 10
  strategies: ["adapter_only", "head_only", "full_finetune"]

evaluation:
  csls_k: 3
  eval_shared1000: true

paths:
  output_dir: "experimental_results/neurobridge_ot_8subj_fewshot"
