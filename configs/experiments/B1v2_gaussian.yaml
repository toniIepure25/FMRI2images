# B1v2: Improved Probabilistic Gaussian Baseline
#
# Changes from B1:
#   - dropout: 0.1 -> 0.3 (reduce overfitting)
#   - gnce.tau: 1.0 -> 0.5 (v1 was the ONLY experiment using tau=1.0;
#     Gaussian log-likelihoods in 768-D need scaling but 0.07 is too aggressive)
#   - lr: 1e-4 -> 3e-5 (v1 training loss INCREASES — model diverges)
#   - weight_decay: 0.01 -> 0.05
#   - gnce.weight: 1.0 -> 2.0 (emphasize contrastive signal over NLL)
#   - warmup_epochs: 5 -> 10
#
# Rationale: v1 best val at epoch 1 (before training) — the model never
# learns. Lower lr + better GNCE temperature should allow convergence.

experiment:
  name: "B1v2_gaussian"
  description: "Improved Gaussian baseline: fixed GNCE tau, lower LR, stronger regularization"
  tags: ["baseline", "gaussian", "probabilistic", "pcr", "queue", "v2"]

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

model:
  type: "gaussian"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [4096, 2048, 1024]
    activation: "gelu"
    dropout: 0.3
  decoder:
    input_dim: 1024
    output_dim: 768
    hidden_dims: [1536]
    activation: "gelu"
    dropout: 0.3
    output_logvar: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 8
  whiten_eps: 1.0e-5
  artifact_path: "cache/embedding_preproc/subj01_center_pcr_k8.pkl"
  fit_on_train: true

loss:
  gaussian_nll:
    enabled: true
    weight: 1.0
    logvar_min: -10.0
    logvar_max: 5.0
    reduction: "mean"
  gaussian_nce:
    enabled: true
    weight: 2.0
    temperature: 0.5
    use_queue: true
    symmetric: false
    clamp_logvar: true
    logvar_min: -10.0
    logvar_max: 5.0
  kl:
    enabled: true
    weight_start: 0.0
    weight_end: 0.001
    anneal_steps: 10000
    anneal_type: "linear"
    free_bits: 0.5
    free_bits_type: "dimension"
  infonce:
    enabled: false
  mse:
    enabled: false

queue:
  enabled: true
  size: 8192

training:
  batch_size: 4
  gradient_accumulation_steps: 16
  mixed_precision: true
  num_epochs: 100
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 15

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/B1v2_gaussian"
