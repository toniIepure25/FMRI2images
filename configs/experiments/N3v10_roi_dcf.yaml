# N3v10: ROI-DCF — Best-of-Both (V8 recipe + V9 eval + novel capacity)
#
# V10 strategy: restore V8's proven multi-loss recipe (hierarchical CLIP +
# CKA + multitask), add V9's free eval wins, then improve capacity.
#
# From V8 (restore):
#   - hierarchical_clip: enabled, weight 0.3
#   - cka: enabled, weight 0.5, per_subject true
#   - vmf_nce_multitask: enabled, lambda_aux 0.5
#   - softclip.weight: 1.0 (was 0.3 in V9)
#   - batch_size: 64, grad_accum: 4 (effective 256)
#   - lr: 5e-5 (original N3 value)
#   - dropout: 0.2
#   - vmf_nce with arctanh + kappa-margin (from V8)
#
# From V9 (keep):
#   - CSLS-corrected retrieval evaluation
#   - MC-Dropout TTA (8 samples) + kappa-weighted avg
#   - bf16 mixed precision
#   - early_stop_min_delta: 0.002
#
# From V9 (remove):
#   - R-Drop (added regularization that hurt)
#   - Label smoothing (same)
#   - DropPath / drop_path_rate (V8 had none and reached 50.8%)
#   - Projection head (not needed with SoftCLIP@1.0)
#
# Novel (V10):
#   - Wider Transformer: d_model=1024, nhead=16, dim_feedforward=4096
#   - Hard negative mining in vMF-NCE (weight=0.5, k=16)
#   - Larger memory queue: 65536
#   - Model soup (top-5 periodic checkpoints)
#   - save_frequency: 10 (periodic checkpoints for soup)

experiment:
  name: "N3v10_roi_dcf"
  description: "v10 ROI-DCF: V8 multi-loss + V9 eval + wider Transformer + hard negatives + model soup"
  tags: ["roi_dcf", "vmf", "vmf_nce", "multi_task", "interpretable", "novel", "v10",
         "multi_subject", "softplus", "hierarchical_clip", "cka", "csls", "mc_tta",
         "hard_neg", "model_soup", "wider_transformer"]
  parent: "N3v9_roi_dcf"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 1024
    nhead: 16
    num_layers: 6
    dim_feedforward: 4096
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_arctanh: true
    margin_base: 0.2
    margin_kappa_ref: 50.0
    hard_negative_weight: 0.5
    hard_neg_k: 16

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.5

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  hierarchical_clip:
    enabled: true
    weight: 0.3

  cka:
    enabled: true
    weight: 0.5
    per_subject: true

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 65536

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  save_frequency: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42
  ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma: 1.0
    steps_min: 10
    steps_max: 50
    delta_beta: 0.5

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  model_soup: true
  soup_top_k: 5
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  compute_per_roi_analysis: true
  seed: 42

paths:
  output_dir: "experimental_results/N3v10_roi_dcf"
