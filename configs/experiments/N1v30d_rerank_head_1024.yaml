# N1v30d: Triple-Head VMF — Compact Retrieval + Dedicated Rerank Head + Rich Regression
#
# V30d adds a dedicated rerank head trained with SoftCLIP on PCA-compressed
# token targets (1024-D). The regression head (197376-D MSE) is retained for
# generative reconstruction but is excluded from retrieval metrics.
#
# Architecture:
#   Head A: compact vMF retrieval (768-D mu + kappa) — contrastive losses
#   Head D: dedicated rerank (1024-D, L2-normed) — SoftCLIP on PCA-compressed targets
#   Head B: rich regression (197376-D) — MSE loss (generative only)
#   Head C: perceptual (disabled)
#
# Two-stage retrieval:
#   Stage A: compact vMF head builds shortlist (CSLS)
#   Stage B: rerank head reranks shortlist (cosine similarity)
#
# Prerequisite:
#   Build PCA-compressed rerank targets first:
#     python scripts/preprocessing/build_rerank_cache.py \
#       --config configs/experiments/N1v30d_rerank_head_1024.yaml
#
# Run:
#   make ablation ONLY=N1v30d SUBJECTS=subj01 GPU=0

experiment:
  name: "N1v30d_rerank_head_1024"
  description: "V30d: Triple-head vMF — compact retrieval (768-D) + rerank head (1024-D) + rich regression (197K-D)"
  tags: ["vmf_triple", "v30", "rerank_head", "compact_retrieval", "regression",
         "token_targets", "dual_target", "wave2"]
  parent: "N1v30a_compact_retrieval"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42
  token_cache_path: "outputs/clip_cache/tokens_ViT-L-14_projected.h5"
  rerank_cache_path: "outputs/rerank_cache/compressed_targets_seed42_trainonly_dim1024.npz"
  dual_target: true

model:
  type: "vmf_triple"
  posterior: "vmf"
  pretrained_encoder_path: "experimental_results/N1v29a_cross_subject/subj01/checkpoint_best.pt"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.25
    use_residual: true
  decoder:
    retrieval_dim: 768
    rerank_enabled: true
    rerank_dim: 1024
    num_tokens: 257
    token_dim_per: 768
    perceptual_enabled: false
    perceptual_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.25
    kappa_mode: "softplus"
    kappa_min: 0.001
    kappa_max: 500.0

  projection_head:
    enabled: false

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true

  regression_mse:
    enabled: true
    weight: 0.5

  rerank_softclip:
    enabled: true
    weight: 1.0
    tau: 0.07
    symmetric: true

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 16
  gradient_accumulation_steps: 16
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 300
  optimizer:
    type: "adamw"
    lr: 3.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 30
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 40
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
