# NeuroBridge-OT: 8-Fold Leave-One-Subject-Out Protocol
# Taxonomy: loso_strict_zero_shot (default) or loso_unsupervised_calibrated
# PRIMARY LOSO PROTOCOL — All 8 NSD subjects, 8 folds

experiment:
  name: "neurobridge_ot_8subj_loso"
  description: "NeuroBridge-OT 8-fold LOSO — train on 7, evaluate held-out target"
  tags: ["neurobridge_ot", "8subj", "loso", "generalization", "zero_shot"]

protocol:
  # Default: strict zero-shot. Override via --mode unsupervised_calibrated
  taxonomy_label: "loso_strict_zero_shot"
  all_subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  n_folds: 8
  # Per-fold: source_subjects = all_subjects minus target_subject
  # target_subject is set per-fold by run_loso_neurobridge_ot.py
  target_subject_seen_during_training: false
  target_calibration_fmri_used: false  # true for unsupervised_calibrated mode
  target_labels_used: false
  target_adapter_fitted: false
  target_learned_parameters_used: false

data:
  subjects: ["subj01", "subj02", "subj03", "subj04", "subj05", "subj06", "subj07", "subj08"]
  split_by_image: true
  exclude_shared1000: true
  val_ratio: 0.10
  embedding_column: "fused"
  seed: 42

model:
  type: "neurobridge_ot"
  d_model: 768
  output_dim: 768
  n_rois: 17
  n_canonical_tokens: 17
  use_fingerprint: true
  use_hyper_adapter: true

  tokenizer:
    type: "learned"
    n_rois: 17
    d_model: 768
    n_attn_heads: 4
    dropout: 0.1
    roi_dropout: 0.1
    max_voxels_per_roi: 2000

  fingerprint:
    fingerprint_dim: 128
    n_subjects: 8
    use_subject_embedding: false  # Critical: no subject embedding for zero-shot

  optimal_transport:
    alignment_mode: "ot"
    epsilon: 0.1
    n_sinkhorn_iters: 50
    cost_type: "cosine"
    use_anatomical_prior: true  # Anatomical prior aids unseen subjects

  transformer:
    n_heads: 12
    n_layers: 6
    dim_feedforward: 3072
    dropout: 0.1
    drop_path_rate: 0.15
    n_subjects: 8
    use_subject_embedding: false  # No subject embedding for zero-shot
    activation: "gelu"
    gradient_checkpointing: false

  heads:
    d_model: 768
    output_dim: 768
    dropout: 0.1
    use_token_head: false
    use_vmf_head: true
    use_calibration_head: false
    kappa_min: 0.001
    kappa_max: 500.0

  hyper_adapter:
    adapter_type: "film"
    hidden_dim: 512

loss:
  w_contrastive: 1.0
  w_regression: 0.5
  w_token: 0.0
  w_teacher: 0.0  # No teacher for fair LOSO
  w_ot: 0.2  # Stronger OT for cross-subject alignment
  w_shared: 0.2  # Stronger shared-image consistency
  w_adversarial: 0.2  # Stronger subject invariance
  w_vmf: 0.3
  w_calibration: 0.0

  contrastive:
    temperature: 0.07
    symmetric: true

  vmf:
    kappa_reg_weight: 0.1
    target_kappa: 50.0

  adversarial:
    d_model: 768
    n_subjects: 8
    hidden_dim: 256
    grl_lambda: 1.5

  shared_consistency:
    margin: 0.8

training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 8
  amp: true
  mixed_precision_dtype: "bf16"
  patience: 30
  warmup_epochs: 5

evaluation:
  csls_k: 3
  eval_shared1000: true

paths:
  output_dir: "experimental_results/neurobridge_ot_8subj_loso"
