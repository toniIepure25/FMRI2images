# N1v11: vMF-NCE — Denoised Hubness-Aware Training
#
# V11 strategy: address the two root causes of the V10 50% R@1 ceiling:
#   1. Hubness in embedding space (7-9pp gap between R@1 and CSLS R@1)
#   2. Low single-trial SNR limiting encoder learning
#
# From V10 (keep):
#   - Wider MLP: [8192, 4096, 4096, 2048]
#   - softclip.weight: 1.0, tau: 0.05
#   - queue: 65536, model soup, CSLS eval, MC-TTA, bf16
#   - batch=64, grad_accum=4 (effective 256)
#
# Novel (V11):
#   - CSLS-corrected contrastive loss (differentiable hubness mitigation)
#   - Inverted softmax component (column-normalised CE, isf_weight=0.3)
#   - Repetition-averaged training (sqrt(3) SNR boost)
#   - Direct cosine alignment loss (batch-independent gradient signal)
#   - Spherical uniformity regularisation (prevents hub formation)
#   - NCSNR voxel attention (reliability-guided input weighting)

experiment:
  name: "N1v11_vmf_nce"
  description: "v11 vMF-NCE: denoised hubness-aware training with CSLS loss + ISF + rep avg + alignment + uniformity"
  tags: ["vmf", "vmf_nce", "queue", "novel", "v11", "softplus", "fused_targets",
         "csls", "mc_tta", "model_soup", "csls_training", "isf", "rep_avg",
         "direct_align", "uniformity", "ncsnr_attention"]
  parent: "N1v10_vmf_nce"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: true
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 4096, 4096, 2048]
    activation: "gelu"
    dropout: 0.2
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"
  ncsnr_attention:
    enabled: true

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_csls_training: true
    csls_k: 10
    isf_weight: 0.3

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  direct_alignment:
    enabled: true
    weight: 0.5

  uniformity:
    enabled: true
    weight: 0.1
    t: 2.0

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  r_drop:
    enabled: false
  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 65536

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 7.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  save_frequency: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  model_soup: true
  soup_top_k: 5
  compute_probabilistic: true
  seed: 42

paths:
  output_dir: "experimental_results/N1v11_vmf_nce"
