# N1v24c_larger_batch: V24 + batch_size 128, gradient_accumulation_steps 2
#
# Hypothesis: With N1v24's hard negatives targeting queue negatives, increasing
#             the in-batch size provides more diverse in-batch negatives per step
#             (128 vs 64). Memory overhead is offset by halving gradient accumulation
#             steps (2 vs 4), keeping effective batch size constant at 256.
#             More in-batch diversity may improve the hard-negative selection quality.
#
# Changes from N1v24_combined:
#   - training.batch_size: 64 → 128
#   - training.gradient_accumulation_steps: 4 → 2
#   (Effective batch = 128 × 2 = 256, same as N1v24)
# Everything else identical to N1v24_combined.
#
# Memory note: wider 4-layer encoder adds ~3GB vs V17's 3-layer encoder.
#              Batch 128 on H100 80GB should be feasible with bf16.
#              If OOM, reduce batch to 96 with grad_accum 3.

experiment:
  name: "N1v24c_larger_batch"
  description: "v24c: V24 + batch 128 (grad_accum 2, same eff batch 256)"
  tags: ["vmf", "vmf_nce", "v24", "wider_encoder", "csls_training", "hard_negatives", "larger_batch", "csls", "shared1000"]
  parent: "N1v24_combined"

data:
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf"
  posterior: "vmf"
  encoder:
    encoder_type: "mlp"
    input_dim: null
    hidden_dims: [8192, 8192, 4096, 2048]
    activation: "gelu"
    dropout: 0.15
    use_residual: true
  decoder:
    input_dim: 2048
    output_dim: 768
    hidden_dims: [2048]
    activation: "gelu"
    dropout: 0.2
    kappa_mode: "softplus"

preprocessing:
  enabled: false

loss:
  vmf_nce:
    enabled: true
    weight: 1.0
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_csls_training: true
    csls_k: 10
    hard_negative_weight: 0.3
    hard_neg_k: 16

  vmf_nll:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

queue:
  enabled: true
  size: 16384

training:
  batch_size: 128               # NEW: 2x in-batch negatives per step
  gradient_accumulation_steps: 2  # NEW: halved to keep eff batch = 256
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
  warmup_epochs: 20
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  early_stop_min_delta: 0.002
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

evaluation:
  use_csls: true
  csls_k: 10
  eval_shared1000: true
  checkpoint_metric: "csls_r@1"
  mc_tta_samples: 8
  kappa_weighted_avg: true

inference:
  use_mean_for_retrieval: true
