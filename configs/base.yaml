# =============================================================================
# Base Configuration — Default Settings for All Phase 2 Experiments
# =============================================================================
#
# Shared defaults inherited by every experiment in the EXP0-EXP14 ablation
# ladder. Experiment-specific configs override individual fields.
#
# Phase 2 target: CLIP ViT-L/14 (768-D) with vMF-NCE, ROI Transformer,
# and Uncertainty-Aware Diffusion.
#
# Reference: Allen et al., 2022 (NSD); Scotti et al., 2024 (MindEye2)
# Version: 4.0
# =============================================================================

# Dataset Configuration
# -----------------------------------------------------------------------------
dataset:
  subject: subj01                    # Subject ID (subj01-subj08)
  subject_num: 1                     # Subject number (1-8)
  max_trials: 30000                  # Maximum number of trials to use
  train_ratio: 0.80                  # Training set ratio (80%)
  val_ratio: 0.10                    # Validation set ratio (10%)
  test_ratio: 0.10                   # Test set ratio (10%)
  index_dir: data/indices/nsd_index  # Path to index files
  
  # Data loading
  num_workers: 4                     # Number of data loader workers
  pin_memory: true                   # Pin memory for faster GPU transfer
  prefetch_factor: 2                 # Prefetch batches per worker

# Preprocessing Configuration
# -----------------------------------------------------------------------------
preprocessing:
  reliability_threshold: 0.1         # Minimum voxel reliability score
  enable_reliability_filter: true   # Enable/disable reliability filtering
  pca_k: 512                        # PCA components for dimensionality reduction
  enable_pca: true                  # Enable/disable PCA (set false to bypass)
  use_roi: false                    # Use ROI-based selection
  scaler_type: standard             # Options: standard, robust, minmax
  
  # Brain masking
  mask_threshold: 0.0               # Voxel activation threshold
  remove_mean: true                 # Remove trial mean before PCA
  
  # Reliability-based voxel weighting (novel contribution)
  # Mode: "hard_threshold" (default, binary mask), "soft_weight" (continuous weights), "none" (all voxels equal)
  reliability_mode: "hard_threshold"
  
  # Soft weighting parameters (only used when reliability_mode="soft_weight")
  reliability_curve: "sigmoid"      # Weighting curve: "sigmoid" or "linear"
  reliability_temperature: 0.1      # Sigmoid temperature (smaller = sharper transition)

# CLIP Model Configuration
# -----------------------------------------------------------------------------
clip:
  model_name: "ViT-L/14"            # CLIP architecture (Phase 2: ViT-L/14)
  pretrained: openai                # Pretrained weights source
  embedding_dim: 768                # Output embedding dimension
  device: cuda                      # Device for CLIP model
  batch_size: 64                    # Batch size for CLIP encoding
  
  # Multi-layer features (ViT-L/14: 24 transformer layers, hidden_dim=1024)
  extract_layers: [6, 12, 18, 24]   # Intermediate layers to extract
  layer_dims:
    layer_6: 1024
    layer_12: 1024
    layer_18: 1024
    layer_24: 768                   # Final projection dimension


# CLIP Embedding Space Configuration
# -----------------------------------------------------------------------------
# Controls which embedding space is modeled and evaluated.
# "normalized" (default) matches existing behavior: embeddings are L2-normalized
# before losses/metrics/selection. "raw" allows experimenting with unnormalized
# embeddings (use with caution; make sure targets and predictions align).
clip_embedding:
  space: normalized                # Options: normalized, raw
  normalize_targets: true          # Keep true to preserve current behavior
  normalize_predictions: true      # Keep true to preserve current behavior

# Training Configuration
# -----------------------------------------------------------------------------
training:
  device: cuda                      # Training device
  seed: 42                          # Random seed for reproducibility
  gradient_clip: 1.0                # Gradient clipping norm
  mixed_precision: false            # Use automatic mixed precision (AMP)
  
  # Learning rate scheduling
  lr_scheduler: cosine              # Options: cosine, step, plateau, none
  warmup_epochs: 5                  # Epochs for warmup
  min_lr: 1.0e-6                    # Minimum learning rate
  
  # Regularization
  weight_decay: 1.0e-4              # L2 regularization
  label_smoothing: 0.0              # Label smoothing (0-0.2)
  
  # Checkpointing
  save_best_only: true              # Save only best model
  save_frequency: 5                 # Save every N epochs
  early_stop_patience: 15           # Early stopping patience

# Loss Function Configuration
# -----------------------------------------------------------------------------
loss:
  cosine_weight: 1.0                # Weight for cosine similarity loss
  mse_weight: 0.0                   # Weight for MSE loss
  infonce_weight: 0.0               # Weight for InfoNCE contrastive loss
  
  # InfoNCE / contrastive parameters
  infonce_temperature: 0.07         # Temperature (lower = harder negatives)
  infonce_normalize: true           # L2-normalize embeddings before contrastive loss

  # vMF-NCE parameters (Phase 2 default — enabled per experiment)
  vmf_nce_weight: 0.0               # Weight for vMF-NCE loss (Banerjee et al., 2005)
  vmf_nce:
    bessel_free: true               # Use Bessel-free approximation
    queue_size: 16384               # Negative queue size
    temperature: 0.07               # Contrastive temperature

  # Gaussian NLL components (off by default)
  nll_weight: 0.0
  cosine_aux_weight: 0.0
  variance_penalty_weight: 0.0
  nll_reduction: mean
  logvar_min: -8.0
  logvar_max: 2.0
  variance_floor: 1.0e-6

# Evaluation Configuration
# -----------------------------------------------------------------------------
evaluation:
  metrics:
    - mse                           # Mean Squared Error
    - cosine_similarity            # Cosine Similarity
    - pearson_correlation          # Pearson Correlation
    - l1_distance                  # L1 Distance
  
  # Retrieval evaluation
  retrieval_top_k: [1, 5, 10, 50]   # Top-K accuracy to compute
  
  # Logging
  log_interval: 10                  # Log every N batches
  eval_interval: 1                  # Evaluate every N epochs

  # Calibration / uncertainty evaluation
  calibration_bins: 10              # Number of bins for reliability curves
  calibration_error_metric: cosine  # Options: cosine, mse

# Decoder Configuration
# -----------------------------------------------------------------------------
decoder:
  type: deterministic               # Options: deterministic, vmf, gaussian
  output_dim: 768                   # Must match clip.embedding_dim

  # vMF decoder parameters (used when type=vmf)
  vmf:
    kappa_mode: "bounded_sigmoid"   # Options: bounded_sigmoid, softplus, exp
    kappa_min: 1.0                  # Minimum concentration
    kappa_max: 256.0                # Maximum concentration
    log_kappa_min: 0.0              # bounded-sigmoid input clamp
    log_kappa_max: 6.0

  # Gaussian decoder (used when type=gaussian)
  gaussian:
    uncertainty: diag               # Options: diag, scalar
    logvar_min: -8.0
    logvar_max: 2.0
    variance_floor: 1.0e-6

# Inference Configuration
# -----------------------------------------------------------------------------
inference:
  sampling_policy: fixed_k          # Options: fixed_k, adaptive_quantile, ua_cfg
  K_base: 1
  K_set: [1, 2, 4, 8, 16]
  selection_rule: cosine            # Options: cosine, likelihood, oracle

  # Decomposed Uncertainty-Aware CFG (Phase 2 novel contribution)
  ua_cfg:
    enabled: false
    w_min: 2.0                      # Min guidance scale (high confidence)
    w_max: 12.0                     # Max guidance scale (low confidence)
    gamma_w: 1.5                    # Kappa-to-guidance exponent
    k_min: 1                        # Min ensemble size
    k_max: 8                        # Max ensemble size
    delta_threshold_low: 0.1        # Low ROI disagreement
    delta_threshold_high: 0.6       # High ROI disagreement
    steps_min: 30                   # Min diffusion steps
    steps_max: 150                  # Max diffusion steps
    abstention_kappa_min: 5.0       # Abstain if kappa below this

# Diffusion Model Configuration (for generation)
# -----------------------------------------------------------------------------
diffusion:
  model_id: "stabilityai/stable-diffusion-2-1"  # Model identifier
  num_inference_steps: 150          # Number of denoising steps
  guidance_scale: 7.5               # Classifier-free guidance scale
  scheduler: euler                  # Scheduler type
  eta: 0.0                          # Noise level (0=deterministic)
  output_size: 768                  # Output image size
  dtype: float32                    # Data type for inference
  
  # Advanced options
  enable_attention_slicing: true    # Reduce memory usage
  enable_vae_slicing: true          # Reduce VAE memory usage
  enable_cpu_offload: false         # Offload to CPU when needed

# Paths Configuration
# -----------------------------------------------------------------------------
paths:
  output_dir: outputs               # Root output directory
  cache_dir: cache                  # Cache directory
  checkpoint_dir: checkpoints       # Model checkpoints
  log_dir: logs                     # Training logs
  report_dir: outputs/reports       # Evaluation reports
  
  # S3 data paths
  s3_bucket: natural-scenes-dataset
  s3_region: us-east-2
  s3_anon: true

# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level: INFO                       # Logging level
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  # Experiment tracking
  use_wandb: false                  # Use Weights & Biases
  use_tensorboard: false            # Use TensorBoard
  
# Metadata
# -----------------------------------------------------------------------------
metadata:
  config_version: "4.0"
  description: "Phase 2 base configuration — ViT-L/14, vMF-NCE, ROI Transformer"
  paper_reference: "Bachelor Thesis 2026"
  dataset_reference: "Allen et al., 2022, Nature Neuroscience"
