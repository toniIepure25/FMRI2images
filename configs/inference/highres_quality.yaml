# =============================================================================
# High-Resolution Quality Configuration
# =============================================================================
#
# Maximum quality for paper figures and demonstrations.
# 200 diffusion steps, 1024px output, DPM++ scheduler.
#
# Usage:
#   python3 scripts/reconstruction/decode_diffusion.py \
#       --config configs/inference/highres_quality.yaml \
#       --checkpoint path/to/best_model.pt
# =============================================================================

_base_: production.yaml

experiment:
  name: highres_quality
  description: "Maximum quality for publication figures"
  tags: [highres, quality, publication]

diffusion:
  model_id: "sd2-community/stable-diffusion-2-1"
  num_inference_steps: 200
  guidance_scale: 8.5
  scheduler: dpm
  output_size: 1024
  output_format: png

  enable_attention_slicing: true
  enable_vae_slicing: true
  enable_vae_tiling: true

batch_processing:
  batch_size: 1
  max_batch_size: 1

output:
  output_dir: "outputs/generations/highres/${dataset.subject}"
  save_metadata: true
