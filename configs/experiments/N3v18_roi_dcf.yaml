# N3v18: ROI-DCF — V17 baseline + MSE loss + PCR anti-hubness + kappa cap
#
# Base: N3v17_roi_dcf.yaml (40.1% R@1 val, shared1000 broken by z-score bug)
# V18 changes:
#   - loss.mse: enabled (direct regression toward CLIP target, MindEye-proven)
#   - preprocessing: center_pcr k=4 (reduces hubness via PC removal)
#   - training.early_stop_min_delta: removed (was 0.002, caused premature stopping)
#   - decoder.kappa_max: 50.0 (V17 kappa=60.3 indicated overconfidence)

experiment:
  name: "N3v18_roi_dcf"
  description: "v18 ROI-DCF: V17 + MSE regression + PCR anti-hubness + kappa cap"
  tags: ["roi_dcf", "vmf", "vmf_nce", "multi_task", "interpretable", "novel", "v18",
         "multi_subject", "softplus", "hierarchical_clip", "cka",
         "csls", "shared1000", "mc_tta", "mse", "pcr"]
  parent: "N3v17_roi_dcf"

data:
  subjects: ["subj01", "subj02", "subj05", "subj07"]
  subject: "subj01"
  roi: "nsdgeneral"
  train_split: 0.90
  val_split: 0.10
  test_split: 0.0
  split_by_image: true
  exclude_shared1000: true
  normalize_fmri: true
  average_repetitions: false
  zscore_mode: "per_session"
  embedding_column: "fused"
  seed: 42

model:
  type: "vmf_dcf"
  posterior: "vmf"
  encoder:
    encoder_type: "multi_subject_roi_transformer"
    input_dim: null
    roi_dims:
      V1v: 700
      V1d: 700
      V2v: 600
      V2d: 600
      V3v: 500
      V3d: 500
      V3A: 350
      V3B: 350
      V4: 500
      FFA1: 200
      FFA2: 200
      PPA: 300
      EBA: 400
      OFA: 200
      OPA: 250
      RSC: 250
      nsdgeneral_other: 9374
    d_model: 768
    nhead: 12
    num_layers: 6
    dim_feedforward: 3072
    dropout: 0.2
    activation: "gelu"
  decoder:
    output_dim: 768
    kappa_mode: "softplus"
    kappa_max: 50.0
    dropout: 0.2
    dcf:
      shared_heads: true
      hidden_dim: null
      return_per_roi: true

preprocessing:
  enabled: true
  mode: "center_pcr"
  k_components: 4

loss:
  mse:
    enabled: true
    weight: 1.0

  vmf_nce:
    enabled: true
    weight: 1.0
    dim: 768
    tau: 1.0
    use_queue: true
    learnable_temperature: true
    use_arctanh: true
    margin_base: 0.2
    margin_kappa_ref: 50.0

  vmf_nce_multitask:
    enabled: true
    lambda_aux: 0.5

  softclip:
    enabled: true
    weight: 1.0
    tau: 0.05
    use_queue: true
    symmetric: true

  hierarchical_clip:
    enabled: true
    weight: 0.3

  cka:
    enabled: true
    weight: 0.5
    per_subject: true

  vmf_nll:
    enabled: false
  gaussian_nll:
    enabled: false
  gaussian_nce:
    enabled: false
  infonce:
    enabled: false
  kl:
    enabled: false

  kappa_reg:
    enabled: true
    lambda_kappa: 0.01

queue:
  enabled: true
  size: 16384

training:
  batch_size: 64
  gradient_accumulation_steps: 4
  mixed_precision: true
  mixed_precision_dtype: "bf16"
  num_epochs: 200
  optimizer:
    type: "adamw"
    lr: 5.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  warmup_epochs: 15
  min_lr: 1.0e-6
  gradient_clip: 1.0
  early_stop_patience: 30
  train_r1_interval: 10
  fmri_noise_std: 0.1
  voxel_dropout: 0.1
  softclip_from_start: true
  mixco:
    enabled: true
    alpha: 0.15
    temperature: 0.07
    weight: 0.5
  ema:
    enabled: true
    decay: 0.999

inference:
  use_mean_for_retrieval: true
  mc_samples_prob_metrics: 64
  seed: 42
  ua_cfg:
    enabled: true
    w_min: 1.5
    w_max: 12.0
    gamma: 1.0
    steps_min: 10
    steps_max: 50
    delta_beta: 0.5

evaluation:
  gallery_sizes: [2, 10, 50, 100, 500, 1000]
  use_csls: true
  csls_k: 10
  mc_tta_samples: 8
  kappa_weighted_avg: true
  eval_shared1000: true
  checkpoint_metric: "r@1"
  compute_probabilistic: true
  compute_attention_analysis: true
  compute_roi_ablation: true
  compute_per_roi_analysis: true
  seed: 42

paths:
  output_dir: "experimental_results/N3v18_roi_dcf"
